id: demo.root-login
version: 1
title: Demo service does not allow root login
severity: high
applies: >-
  svc.present
setting:
  fact: svc.config.permitrootlogin
  in: ["no"]
  absent: default
tests:
  - name: disabled explicitly
    facts:
      svc: {present: true, config: {permitrootlogin: {value: "no", explicit: true, source: "/etc/svc.conf:3"}}}
    want: PASS
  - name: allowed
    facts:
      svc: {present: true, config: {permitrootlogin: {value: "yes", explicit: true, source: "/etc/svc.conf:3"}}}
    want: FAIL
  - name: default is compared
    facts:
      svc: {present: true, config: {permitrootlogin: {value: "prohibit-password", explicit: false, source: "default"}}}
    want: FAIL
  - name: not installed
    facts:
      svc: {present: false}
    want: NOT_APPLICABLE
  - name: default unknown
    input: absent
    facts:
      svc: {present: true, config: {}}
    want: ERROR
  - name: collector failed
    input: unavailable
    unavailable: [svc]
    want: ERROR
  - name: partial config
    input: incomplete
    incomplete: [svc]
    facts:
      svc: {present: true, config: {permitrootlogin: {value: "yes", explicit: true}}}
    want: ERROR
