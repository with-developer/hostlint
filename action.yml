name: hostlint
description: Check a container image, an image archive or a mounted root filesystem against a hardening profile (KISA 2026 by default), and gate the build on what it finds.
author: with-developer
branding:
  icon: shield
  color: blue

inputs:
  image:
    description: A container image on this runner (for example one the job just built). It is saved with docker save and scanned. Set one of image, image-tar and root.
    required: false
    default: ""
  image-tar:
    description: A docker save or OCI archive to scan.
    required: false
    default: ""
  root:
    description: A root filesystem mounted or unpacked on this runner (a VM disk, a golden image).
    required: false
    default: ""
  profile:
    description: The profile to check against, or several separated by spaces (default kisa-2026, or the profile of the config file).
    required: false
    default: ""
  pack:
    description: A policy pack in this repository (a directory of your own checks and profiles, docs/packs.md); select its profile with profile. The pack is trusted like your workflow, so use packs of people you trust.
    required: false
    default: ""
  fail-on:
    description: Fail the step when a control of this severity or higher fails or cannot be checked - low, medium, high or none.
    required: false
    default: high
  config:
    description: A hostlint.yaml (profile choice, stricter parameters, waivers with a reason and an expiry).
    required: false
    default: ""
  sarif-file:
    description: When set, also write the result as SARIF to this file, for GitHub code scanning (github/codeql-action/upload-sarif). It is written even when the scan fails the step.
    required: false
    default: ""
  version:
    description: The hostlint release to install, such as v0.12.0. By default the release the action itself is pinned to (uses ...@v0.13.0); a commit pin needs this input. The archive is checked against the signed checksums of the release.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install hostlint
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        ACTION_REF: ${{ github.action_ref }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        if [ "$RUNNER_OS" != Linux ]; then
          echo "::error::hostlint runs on Linux runners, not $RUNNER_OS"
          exit 2
        fi
        version="$INPUT_VERSION"
        if [ -z "$version" ]; then
          if [[ "$ACTION_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            version="$ACTION_REF"
          elif [[ "$ACTION_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::the action is pinned to a commit: set the version input to the hostlint release to install (a commit says nothing about which one)"
            exit 2
          elif [ -n "$ACTION_REF" ]; then
            echo "::warning::the action is pinned to $ACTION_REF, which is not a release tag: installing the latest hostlint release. Pin the action to a release tag, or set the version input."
          fi
        fi
        bin="$RUNNER_TEMP/hostlint-bin"
        mkdir -p "$bin"
        args=(-b "$bin")
        if [ -n "$version" ]; then args+=(-v "$version"); fi
        sh "$ACTION_PATH/install.sh" "${args[@]}"
        echo "$bin" >> "$GITHUB_PATH"

    - name: Scan
      shell: bash
      env:
        INPUT_IMAGE: ${{ inputs.image }}
        INPUT_IMAGE_TAR: ${{ inputs.image-tar }}
        INPUT_ROOT: ${{ inputs.root }}
        INPUT_PROFILE: ${{ inputs.profile }}
        INPUT_PACK: ${{ inputs.pack }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_SARIF_FILE: ${{ inputs.sarif-file }}
      run: |
        set -euo pipefail
        # The inputs reach the shell as variables, never as text of the script.
        # All of them are checked before anything is done.
        chosen=0
        for v in "$INPUT_IMAGE" "$INPUT_IMAGE_TAR" "$INPUT_ROOT"; do
          if [ -n "$v" ]; then chosen=$((chosen + 1)); fi
        done
        if [ "$chosen" -ne 1 ]; then
          echo "::error::set exactly one of image, image-tar and root"
          exit 2
        fi
        case "$INPUT_FAIL_ON" in
          low | medium | high | none) ;;
          *)
            echo "::error::fail-on is low, medium, high or none, not: $INPUT_FAIL_ON"
            exit 2
            ;;
        esac
        if [ -n "$INPUT_IMAGE" ] && ! [[ "$INPUT_IMAGE" =~ ^[A-Za-z0-9][A-Za-z0-9._:/@+-]*$ ]]; then
          echo "::error::image is not an image reference: $INPUT_IMAGE"
          exit 2
        fi
        target=()
        if [ -n "$INPUT_IMAGE" ]; then
          archive="$RUNNER_TEMP/hostlint-image.tar"
          docker save --output "$archive" "$INPUT_IMAGE"
          target=(--image-tar "$archive")
        elif [ -n "$INPUT_IMAGE_TAR" ]; then
          target=(--image-tar "$INPUT_IMAGE_TAR")
        else
          target=(--root "$INPUT_ROOT")
        fi
        common=()
        set -f # no file name expansion of the profile list
        for p in $INPUT_PROFILE; do
          if ! [[ "$p" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
            echo "::error::profile is a profile ID, or several separated by spaces, not: $p"
            exit 2
          fi
          common+=(--profile "$p")
        done
        set +f
        if [ -n "$INPUT_PACK" ]; then common+=(--pack "$INPUT_PACK"); fi
        if [ -n "$INPUT_CONFIG" ]; then common+=(--config "$INPUT_CONFIG"); fi
        # The SARIF file first, with nothing that fails: the report is wanted when the gate fails, too.
        if [ -n "$INPUT_SARIF_FILE" ]; then
          hostlint scan "${target[@]}" "${common[@]}" --format sarif --output "$INPUT_SARIF_FILE" --fail-on none
        fi
        hostlint scan "${target[@]}" "${common[@]}" --fail-on "$INPUT_FAIL_ON" --color always
