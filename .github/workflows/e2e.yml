name: e2e

# hostlint in containers of every supported distribution, stock and hardened,
# compared with e2e/testdata. Runs when what decides a result changes.
on:
  pull_request:
    paths:
      - "internal/collect/**"
      - "internal/engine/**"
      - "internal/hostfs/**"
      - "rules/**"
      - "profiles/**"
      - "e2e/**"
      - ".github/workflows/e2e.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    name: e2e (${{ matrix.distro }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04, debian-12, debian-13, rocky-9, rocky-10, almalinux-9, almalinux-10, centos-7]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - run: make e2e E2E_RUN=${{ matrix.distro }}
