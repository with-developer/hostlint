name: Pages

# Publishes site/ to GitHub Pages when a change to it reaches main, and by hand (Actions, Run workflow). A custom domain needs the
# owner's approval. The live demo (site/demo) is built here, not kept in the repository: the dashboard with the recorded answers of
# `vmsctl server demo` (scripts/build-demo.sh), so it follows the dashboard and the rules.
on:
  push:
    branches: [main]
    paths: ["site/**", "web/**", "scripts/build-demo.sh", "internal/server/**", "rules/**", "profiles/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write # publish
      id-token: write # prove where the deployment comes from
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Build the live demo into site/demo
        run: |
          go build -trimpath -o vmsctl ./cmd/vmsctl
          ./scripts/build-demo.sh
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
