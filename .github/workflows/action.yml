name: action

# The action of this repository (action.yml), run on an image against a fixed release (a later release may
# change what debian:12 fails).
on:
  pull_request:
    paths:
      - "action.yml"
      - "install.sh"
      - ".github/workflows/action.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker pull --quiet debian:12
      - uses: ./
        with:
          image: debian:12
          fail-on: none
          sarif-file: vmsctl.sarif
          version: v0.12.0
      - name: The SARIF file is there and is JSON
        run: python3 -c 'import json; r = json.load(open("vmsctl.sarif")); assert r["runs"][0]["results"], "no results"'
      - name: A gate that fails fails the step
        id: gate
        continue-on-error: true
        uses: ./
        with:
          image: debian:12
          fail-on: high
          version: v0.12.0
      - name: It did
        run: test "${{ steps.gate.outcome }}" = failure
      - name: Korean titles in the log and the summary (a release that has --lang)
        uses: ./
        with:
          image: debian:12
          fail-on: none
          lang: ko
          version: v0.37.0
      - name: A language that is none of ours is refused
        id: badlang
        continue-on-error: true
        uses: ./
        with:
          image: debian:12
          lang: fr
          version: v0.37.0
      - run: test "${{ steps.badlang.outcome }}" = failure
      - name: No input is refused
        id: none
        continue-on-error: true
        uses: ./
      - run: test "${{ steps.none.outcome }}" = failure

  pack:
    name: policy pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker pull --quiet debian:12
      - name: The example pack and its profile, with KISA
        uses: ./
        with:
          image: debian:12
          pack: examples/policy-pack
          profile: kisa-2026 x-acme-baseline
          fail-on: none
          sarif-file: vmsctl.sarif
          version: v0.15.0
      - name: The SARIF file is there
        run: python3 -c 'import json; r = json.load(open("vmsctl.sarif")); assert r["runs"][0]["results"], "no results"'
      - name: A pack without its profile is refused
        id: noprofile
        continue-on-error: true
        uses: ./
        with:
          image: debian:12
          pack: examples/policy-pack
          fail-on: none
          version: v0.15.0
      - run: test "${{ steps.noprofile.outcome }}" = failure
