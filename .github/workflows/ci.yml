name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1" # weekly: catch newly published vulnerabilities
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR runs replace each other; every commit on main keeps its own run.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: [oldstable, stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - run: make test
      # Some host-access tests need root (files owned by other users).
      - name: Host access tests as root
        run: sudo env "PATH=$PATH" GOCACHE=/tmp/gocache-root GOMODCACHE="$(go env GOMODCACHE)" go test -count=1 ./internal/hostfs/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      # Same command as locally: builds the pinned golangci-lint with this Go,
      # lints, proves the ADR 0004 guards fire, and checks go.mod is tidy.
      - run: make lint

  build:
    name: build (linux/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history so the version stamp is right
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - run: make build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
      - name: Check the binary is static
        run: file hostlint | tee /dev/stderr | grep -q 'statically linked'
      - name: Smoke test
        if: matrix.goarch == 'amd64'
        run: ./hostlint version

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - run: make vuln

  # Single required status check for branch protection. Fails unless every
  # job above succeeded (a skipped or cancelled job counts as a failure).
  ci-ok:
    if: always()
    needs: [test, lint, build, vuln]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done
