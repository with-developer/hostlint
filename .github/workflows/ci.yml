name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1" # weekly: catch newly published vulnerabilities
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read # the files of a pull request, for the translation check

concurrency:
  # PR runs replace each other; every commit on main keeps its own run.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: [oldstable, stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - run: make test
      # Some host-access tests need root (files owned by other users).
      - name: Host access tests as root
        run: sudo env "PATH=$PATH" GOCACHE=/tmp/gocache-root GOMODCACHE="$(go env GOMODCACHE)" go test -count=1 ./internal/hostfs/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      # Same command as locally: builds the pinned golangci-lint with this Go,
      # lints, proves the ADR 0004 guards fire, and checks go.mod is tidy.
      - run: make lint
      # An English user doc that has a Korean translation changes together with it.
      - name: Translations follow their English docs
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/${{ github.event.pull_request.number }}/files" --jq '.[].filename' |
            scripts/check-translations.sh

  build:
    name: build (linux/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history so the version stamp is right
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - run: make build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
      - name: Check the binary is static
        run: file hostlint | tee /dev/stderr | grep -q 'statically linked'
      - name: Smoke test
        if: matrix.goarch == 'amd64'
        run: ./hostlint version

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - run: make vuln

  # Builds every release artifact as a snapshot (unsigned, unpublished), so the
  # release pipeline is tested before a tag needs it (docs/RELEASING.md).
  release-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # GoReleaser derives the version from tags
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.55.0
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.3 # keep in step with GORELEASER_VERSION in the Makefile
          args: release --snapshot --clean --skip=sign
      - run: shellcheck install.sh scripts/*.sh
      - run: scripts/check-release.sh dist

  # Single required status check for branch protection. Fails unless every
  # job above succeeded (a skipped or cancelled job counts as a failure).
  ci-ok:
    if: always()
    needs: [test, lint, build, vuln, release-snapshot]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done
