name: Container image

# Builds the image of a release from the verified release archives and publishes it to ghcr.io. It runs after the
# Release workflow succeeded, and by hand for a tag whose image is missing (Actions, Run workflow). A separate
# workflow: a failure here never holds back a release.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag to build the image of, such as v0.21.0"
        required: true

permissions:
  contents: read

concurrency:
  group: container-${{ github.event.inputs.tag || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    # A tag push that the Release workflow finished; or a dispatch.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the image
      id-token: write # Sigstore keyless signing and build provenance
      attestations: write
    env:
      TAG: ${{ github.event.inputs.tag || github.event.workflow_run.head_branch }}
    steps:
      - name: The tag is a version
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "not a version tag: $TAG" >&2; exit 1; }
          # Releases before v0.27.0 were published as hostlint (ADR 0017): their archives are named hostlint_*, and their
          # signing identity names the old repository, so this workflow cannot build their image.
          [[ ! "$TAG" =~ ^v0\.([0-9]|1[0-9]|2[0-6])\. ]] || { echo "$TAG predates the rename to vmsctl (v0.27.0): no image is built for it" >&2; exit 1; }
      # The workflow's own branch: the Dockerfile is this workflow's, and a tag made before it existed has none.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - name: Download and verify the release archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dl && cd dl
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p checksums.txt -p checksums.txt.sigstore.json -p 'vmsctl_*_linux_*.tar.gz'
          cosign verify-blob checksums.txt --bundle checksums.txt.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${TAG}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          for arch in amd64 arm64; do
            f="vmsctl_${TAG#v}_linux_${arch}.tar.gz"
            # each archive has to be listed in the signed checksums: a missing line must not pass
            line=$(awk -v f="$f" '$2 == f' checksums.txt) # the line of exactly this file
            [ -n "$line" ] || { echo "$f is not in the signed checksums" >&2; exit 1; }
            echo "$line" | sha256sum -c -
            mkdir -p "../ctx/linux-$arch"
            tar -xzf "$f" -C "../ctx/linux-$arch" vmsctl
          done
          cd ..
          # The binary says which version it is: the image must be of the tag it is named for.
          ctx/linux-amd64/vmsctl version | grep -F "vmsctl ${TAG} " >/dev/null || { echo "the binary is not ${TAG}" >&2; exit 1; }
          # the commit of the tag, for the image's revision label
          git fetch -q --depth=1 origin "refs/tags/${TAG}:refs/tags/${TAG}"
          echo "REVISION=$(git rev-list -n 1 "refs/tags/${TAG}")" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image tags
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${TAG#v}"
          tags="${IMAGE}:${v}"
          # latest follows the newest release: never a pre-release, never an older tag that is rebuilt
          newest=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-pre-releases --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName')
          if [ "$TAG" = "$newest" ]; then tags="${tags},${IMAGE}:latest"; fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: ctx
          file: packaging/container/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.title=vmsctl
            org.opencontainers.image.description=Checks a Linux host's security configuration against hardening baselines. It only reads.
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.TAG }}
            org.opencontainers.image.revision=${{ env.REVISION }}
            org.opencontainers.image.licenses=Apache-2.0
      - name: Sign the image
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
