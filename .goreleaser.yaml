# Release build for hostlint; see docs/RELEASING.md. `make snapshot` builds
# the same artifacts locally without publishing, and CI does so on every PR.
version: 2

project_name: hostlint

builds:
  - id: hostlint
    main: ./cmd/hostlint
    binary: hostlint
    env:
      - CGO_ENABLED=0 # static binaries
    goos: [linux]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - -s -w
      - -X github.com/with-developer/hostlint/internal/version.version=v{{ .Version }}
      - -X github.com/with-developer/hostlint/internal/version.commit={{ .FullCommit }}
      - -X github.com/with-developer/hostlint/internal/version.date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}" # reproducible

archives:
  - id: hostlint
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

nfpms:
  - id: hostlint
    package_name: hostlint
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: hostlint
    homepage: https://github.com/with-developer/hostlint
    maintainer: hostlint project <https://github.com/with-developer/hostlint/issues>
    description: |-
      Checks a Linux host's security configuration against hardening baselines
      and reports a result per control, with the evidence behind it. It only
      reads: it never changes the host it scans.
    license: Apache-2.0
    section: admin
    formats: [deb, rpm]
    bindir: /usr/bin
    contents:
      - src: LICENSE
        dst: /usr/share/doc/hostlint/LICENSE
        file_info:
          mode: 0644
      - src: README.md
        dst: /usr/share/doc/hostlint/README.md
        file_info:
          mode: 0644

checksum:
  name_template: checksums.txt
  algorithm: sha256

# An SPDX SBOM next to every archive and package (syft).
sboms:
  - id: archives
    artifacts: archive
  - id: packages
    artifacts: package

# checksums.txt covers every file of the release; signing it with Sigstore
# (keyless: the identity is this repository's release workflow) covers them all.
signs:
  - id: checksums
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --bundle=${signature}
      - ${artifact}
      - --yes

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot.{{ .ShortCommit }}"

# Release notes from the squash-merged Conventional Commit titles.
changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^(docs|test|ci|chore|refactor)(\\([^)]+\\))?:"
      - "^Merge "
  groups:
    - title: Features
      regexp: '^feat(\([^)]+\))?!?:'
      order: 0
    - title: Bug fixes
      regexp: '^fix(\([^)]+\))?!?:'
      order: 1
    - title: Other changes
      order: 999

release:
  # The release workflow checks the artifacts and attests their provenance
  # before it publishes the draft.
  draft: true
  prerelease: auto
  footer: |
    ## Verify

    `checksums.txt` has the SHA-256 of every file here and is signed with Sigstore by this
    repository's release workflow:

    ```sh
    cosign verify-blob checksums.txt --bundle checksums.txt.sigstore.json \
      --certificate-identity "https://github.com/with-developer/hostlint/.github/workflows/release.yml@refs/tags/{{ .Tag }}" \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com
    sha256sum --ignore-missing -c checksums.txt
    ```

    Build provenance: `gh attestation verify <file> --repo with-developer/hostlint`.
