# Release build for vmsctl; see docs/RELEASING.md. `make snapshot` builds
# the same artifacts locally without publishing, and CI does so on every PR.
version: 2

project_name: vmsctl

git:
  # A release and its release candidate may share a commit (v0.1.0 and
  # v0.1.0-rc.1 did). git sorts a pre-release after the release by default, so
  # GoReleaser took the rc as the version of the release's own build; with the
  # suffix declared, the release sorts last. The workflow also names the tag.
  prerelease_suffix: "-"

# The dashboard (web/) is built first and embedded with the `web` build tag.
before:
  hooks:
    - sh -c 'cd web && npm ci --ignore-scripts && npm run build'

builds:
  - id: vmsctl
    main: ./cmd/vmsctl
    binary: vmsctl
    env:
      - CGO_ENABLED=0 # static binaries
    goos: [linux]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
      - -buildvcs=false
      - -tags=web
    ldflags:
      - -s -w
      - -X github.com/with-developer/vmsctl/internal/version.version=v{{ .Version }}
      - -X github.com/with-developer/vmsctl/internal/version.commit={{ .FullCommit }}
      - -X github.com/with-developer/vmsctl/internal/version.date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}" # reproducible

archives:
  - id: vmsctl
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

nfpms:
  - id: vmsctl
    package_name: vmsctl
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: vmsctl
    homepage: https://github.com/with-developer/vmsctl
    maintainer: vmsctl project <https://github.com/with-developer/vmsctl/issues>
    description: |-
      Checks a Linux host's security configuration against hardening baselines
      and reports a result per control, with the evidence behind it. It only
      reads: it never changes the host it scans.
    license: Apache-2.0
    section: admin
    formats: [deb, rpm]
    bindir: /usr/bin
    # The package replaces the one of the old name, and keeps a link under it for a while (ADR 0017): units, cron
    # entries and CI that still say hostlint go on working, and the program says it is deprecated.
    replaces: [hostlint]
    provides: [hostlint]
    conflicts: [hostlint]
    contents:
      - src: vmsctl
        dst: /usr/bin/hostlint
        type: symlink
      - src: LICENSE
        dst: /usr/share/doc/vmsctl/LICENSE
        file_info:
          mode: 0644
      - src: README.md
        dst: /usr/share/doc/vmsctl/README.md
        file_info:
          mode: 0644

checksum:
  name_template: checksums.txt
  algorithm: sha256

# An SPDX SBOM next to every archive and package (syft).
sboms:
  - id: archives
    artifacts: archive
  - id: packages
    artifacts: package

# checksums.txt covers every file of the release; signing it with Sigstore
# (keyless: the identity is this repository's release workflow) covers them all.
signs:
  - id: checksums
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --bundle=${signature}
      - ${artifact}
      - --yes

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot.{{ .ShortCommit }}"

# Release notes from the squash-merged Conventional Commit titles.
changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^(docs|test|ci|chore|refactor)(\\([^)]+\\))?:"
      - "^Merge "
  groups:
    - title: Features
      regexp: '^feat(\([^)]+\))?!?:'
      order: 0
    - title: Bug fixes
      regexp: '^fix(\([^)]+\))?!?:'
      order: 1
    - title: Other changes
      order: 999

release:
  # The release workflow checks the artifacts and attests their provenance
  # before it publishes the draft.
  draft: true
  prerelease: auto
  footer: |
    ## Verify

    `checksums.txt` has the SHA-256 of every file here and is signed with Sigstore by this
    repository's release workflow:

    ```sh
    cosign verify-blob checksums.txt --bundle checksums.txt.sigstore.json \
      --certificate-identity "https://github.com/with-developer/vmsctl/.github/workflows/release.yml@refs/tags/{{ .Tag }}" \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com
    sha256sum --ignore-missing -c checksums.txt
    ```

    Build provenance: `gh attestation verify <file> --repo with-developer/vmsctl`.
