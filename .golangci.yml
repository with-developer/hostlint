version: "2"

linters:
  default: standard
  enable:
    - depguard
    - errorlint
    - exhaustive
    - forbidigo
    - gocritic
    - gosec
    - misspell
    - nolintlint
    - revive
    - unconvert
    - unparam
  settings:
    # ADR 0004 guards. scripts/lint-guards.sh proves each rule fires.
    depguard:
      rules:
        exec:
          files:
            - "$all"
            - "!**/internal/hostfs/**"
          deny:
            - pkg: os/exec
              desc: only internal/hostfs may run commands (ADR 0004)
            - pkg: golang.org/x/sys/execabs
              desc: only internal/hostfs may run commands (ADR 0004)
        syscalls:
          files:
            - "$all"
            - "!**/internal/hostfs/**"
            - "!**/cmd/hostlint/main.go" # signal numbers only; calls are banned below
          deny:
            - pkg: syscall
              desc: raw system calls belong in internal/hostfs (ADR 0004)
            - pkg: golang.org/x/sys/unix
              desc: raw system calls belong in internal/hostfs (ADR 0004)
        network:
          files:
            - "$all"
          deny:
            - pkg: net/http
              desc: v0.1 makes no network connections (ADR 0004)
    forbidigo:
      analyze-types: true
      forbid:
        # Never modify the host. Writing the report the user asked for is the
        # only exception (internal/output, see exclusions).
        - pattern: ^os\.(Create|CreateTemp|WriteFile|OpenFile|Mkdir|MkdirAll|MkdirTemp|Remove|RemoveAll|Rename|Chmod|Chown|Lchown|Chtimes|Symlink|Link|Truncate|CopyFS|StartProcess)$
          msg: hostlint must not modify the host (ADR 0004)
        - pattern: ^os\.Root\.(Create|OpenFile|WriteFile|Mkdir|MkdirAll|Remove|RemoveAll|Rename|Chmod|Chown|Lchown|Chtimes|Symlink|Link)$
          msg: hostlint must not modify the host (ADR 0004)
        - pattern: ^os\.(File\.(Chmod|Chown)|Process\.(Kill|Signal))$
          msg: hostlint must not modify the host (ADR 0004)
        # Applies inside internal/hostfs too, which may otherwise use raw syscalls.
        - pattern: ^(syscall|unix)\.(Unlink|Unlinkat|Rmdir|Rename|Renameat|Renameat2|Chmod|Fchmod|Fchmodat|Chown|Fchown|Fchownat|Lchown|Truncate|Ftruncate|Mkdir|Mkdirat|Mknod|Mknodat|Symlink|Symlinkat|Link|Linkat|Write|Pwrite|Writev|Pwritev|Utimes|UtimesNano|UtimesNanoAt|Futimes|Setxattr|Lsetxattr|Fsetxattr|Removexattr|Lremovexattr|Fremovexattr|Mount|Unmount|Kill|Tgkill|Exec|ForkExec)$
          msg: hostlint must not modify the host (ADR 0004)
        # Read the host only through internal/hostfs (denylist, --root).
        - pattern: ^os\.(Open|ReadFile|ReadDir|Stat|Lstat|Readlink|DirFS|OpenRoot|OpenInRoot|Hostname)$
          msg: read the host through internal/hostfs (ADR 0004)
        - pattern: ^filepath\.(Walk|WalkDir|Glob|EvalSymlinks)$
          msg: read the host through internal/hostfs (ADR 0004)
        - pattern: ^syscall\.[A-Z][a-z0-9_]
          msg: raw system calls belong in internal/hostfs (ADR 0004)
        - pattern: ^net\.((Dialer|ListenConfig)\.)?(Dial|DialContext|DialTimeout|DialIP|DialTCP|DialUDP|DialUnix|Listen|ListenPacket|ListenIP|ListenTCP|ListenUDP|ListenUnix|ListenUnixgram|ListenMulticastUDP)$
          msg: v0.1 makes no network connections (ADR 0004)
        # Commands write to the io.Writer they were given.
        - pattern: ^(fmt\.Print(f|ln)?|print|println)$
          msg: write to the command's io.Writer
    exhaustive:
      default-signifies-exhaustive: true
    nolintlint:
      require-explanation: true
      require-specific: true
    misspell:
      locale: US
  exclusions:
    presets:
      - comments
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - forbidigo
          - gosec
      - path: internal/hostfs/
        linters:
          - forbidigo
        text: (read the host through internal/hostfs|raw system calls belong)
      - path: internal/output/
        linters:
          - forbidigo
        text: use of `os\.(Create|OpenFile|WriteFile|Remove|Rename)` forbidden

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/with-developer/hostlint
