id: accounts.password-hash-strength
version: 1
title: Stored passwords use a strong hash
title_ko: 저장된 비밀번호가 강한 해시를 씀
severity: medium
description: >-
  Lists accounts whose /etc/shadow hash uses DES, MD5 or an unrecognized scheme. Without
  /etc/shadow there is nothing to check, so the check cannot pass.
rationale: Changing ENCRYPT_METHOD only affects new passwords; old weak hashes stay crackable.
remediation: Have the listed users change their passwords (passwd -e user forces it at next login).
violations:
  over: shadow.entries
  as: e
  where: e.state != "empty" && e.algorithm in ["md5", "des", "unknown"]
  key: e.name
  text: >-
    e.name + " has a " + e.algorithm + " password hash"
tests:
  - name: strong hashes
    facts:
      shadow: {present: true, entries: [{name: root, state: set, algorithm: sha512}, {name: daemon, state: locked, algorithm: ""}]}
    want: PASS
  - name: md5 hash
    facts:
      shadow: {present: true, entries: [{name: legacy, state: set, algorithm: md5}]}
    want: FAIL
  - name: no shadow file
    input: absent
    facts:
      shadow: {present: false, entries: []}
    want: ERROR
  - name: shadow unreadable without root
    input: unavailable
    unavailable: [shadow]
    want: ERROR
