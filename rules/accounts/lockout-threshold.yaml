id: accounts.lockout-threshold
version: 1
title: Accounts lock after repeated login failures
title_ko: 로그인에 여러 번 실패하면 계정이 잠김
severity: high
description: >-
  Checks that the login and (when an SSH server is present) sshd PAM stacks lock an account
  after at most `max_failures` failed attempts, with pam_faillock or pam_tally2. pam_faillock
  only locks with an authfail line plus a preauth or account line, and sshd only uses PAM with
  UsePAM yes.
rationale: Without a lockout, an attacker can try passwords against an account indefinitely.
remediation: >-
  Enable pam_faillock (authselect enable-feature with-faillock, or preauth, authfail and
  account lines on Debian), set `deny = 10` or less in /etc/security/faillock.conf, and keep
  `UsePAM yes` in sshd_config.
params:
  max_failures: {type: int, default: 10, stricter: lower, description: Failed attempts before an account locks}
expect: >-
  pam.lockout.login.enforced &&
  int(pam.lockout.login.settings.deny.value) >= 1 &&
  int(pam.lockout.login.settings.deny.value) <= params.max_failures &&
  (!sshd.present ||
   (sshd.config.usepam.value == "yes" &&
    pam.lockout.sshd.enforced &&
    int(pam.lockout.sshd.settings.deny.value) >= 1 &&
    int(pam.lockout.sshd.settings.deny.value) <= params.max_failures))
tests:
  - name: faillock on both stacks
    facts:
      sshd: {present: true, config: {usepam: {value: "yes"}}}
      pam: {lockout: {login: {module: pam_faillock.so, enforced: true, actions: [preauth, authfail], settings: {deny: {value: "5", explicit: true}}}, sshd: {module: pam_faillock.so, enforced: true, actions: [preauth, authfail], settings: {deny: {value: "3", source: "default (faillock.conf(5))"}}}}}
    want: PASS
  - name: no SSH server, login stack locks
    facts:
      sshd: {present: false}
      pam: {lockout: {login: {module: pam_tally2.so, enforced: true, settings: {deny: {value: "10", explicit: true}}}, sshd: {settings: {}}}}
    want: PASS
  - name: preauth only never counts failures
    facts:
      sshd: {present: false}
      pam: {lockout: {login: {module: pam_faillock.so, enforced: false, actions: [preauth], settings: {deny: {value: "5"}}}, sshd: {settings: {}}}}
    want: FAIL
  - name: sshd stack does not lock
    facts:
      sshd: {present: true, config: {usepam: {value: "yes"}}}
      pam: {lockout: {login: {module: pam_faillock.so, enforced: true, settings: {deny: {value: "5"}}}, sshd: {settings: {}}}}
    want: FAIL
  - name: sshd does not use PAM
    facts:
      sshd: {present: true, config: {usepam: {value: "no"}}}
      pam: {lockout: {login: {module: pam_faillock.so, enforced: true, settings: {deny: {value: "5"}}}, sshd: {module: pam_faillock.so, enforced: true, settings: {deny: {value: "5"}}}}}
    want: FAIL
  - name: tally2 without deny never locks
    facts:
      sshd: {present: false}
      pam: {lockout: {login: {module: pam_tally2.so, enforced: true, settings: {deny: {value: "0", source: "default (pam_tally2(8): no lockout)"}}}, sshd: {settings: {}}}}
    want: FAIL
  - name: too many attempts allowed
    facts:
      sshd: {present: false}
      pam: {lockout: {login: {module: pam_faillock.so, enforced: true, settings: {deny: {value: "20"}}}, sshd: {settings: {}}}}
    want: FAIL
  - name: PAM incomplete
    input: incomplete
    incomplete: [pam]
    facts:
      sshd: {present: false}
      pam: {lockout: {login: {module: pam_faillock.so, enforced: true, settings: {deny: {value: "5"}}}, sshd: {settings: {}}}}
    want: ERROR
