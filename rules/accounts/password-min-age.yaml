id: accounts.password-min-age
version: 1
title: Passwords cannot be changed back at once
title_ko: 비밀번호 최소 사용 기간 설정
severity: low
description: Checks PASS_MIN_DAYS in /etc/login.defs, the minimum days between password changes.
rationale: >-
  Without a minimum age, a user can cycle through passwords in minutes to get back to the old
  one and defeat the password history.
remediation: Set `PASS_MIN_DAYS 1` (or more) in /etc/login.defs.
params:
  min_days: {type: int, default: 1, stricter: higher, description: Minimum password age in days}
setting:
  fact: login_defs.settings.PASS_MIN_DAYS
  range: {min: params.min_days, max: 99999}
  absent: default
tests:
  - name: one day
    facts:
      login_defs: {present: true, settings: {PASS_MIN_DAYS: {value: "1", explicit: true}}}
    want: PASS
  - name: zero
    facts:
      login_defs: {present: true, settings: {PASS_MIN_DAYS: {value: "0", explicit: true}}}
    want: FAIL
  - name: unset
    input: absent
    facts:
      login_defs: {present: true, settings: {PASS_MIN_DAYS: {value: "-1", source: "default (login.defs(5))"}}}
    want: FAIL
