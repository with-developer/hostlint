id: accounts.system-account-shells
version: 1
title: System accounts cannot log in
title_ko: 시스템 계정은 로그인할 수 없음
severity: low
description: >-
  Lists system accounts (UID 1 to `system_uid_max`, and the overflow accounts such as nobody,
  UID 65534 or 4294967294) that have a login shell instead of nologin or false.
description_ko: >-
  시스템 계정(UID 1부터 `system_uid_max`까지, 그리고 nobody, UID 65534, 4294967294 같은 오버플로 계정) 중에서 nologin이나
  false가 아닌 로그인 셸을 가진 것을 나열합니다.
rationale: A service account with a shell gives an attacker who reaches it an interactive foothold.
rationale_ko: >-
  셸이 있는 서비스 계정은 그 계정에 접근한 공격자에게 대화형으로 발판을 줍니다.
remediation: Set the shell to /usr/sbin/nologin (usermod -s /usr/sbin/nologin account).
remediation_ko: >-
  셸을 /usr/sbin/nologin으로 바꾸세요(`usermod -s /usr/sbin/nologin 계정`).
params:
  system_uid_max: {type: int, default: 999, stricter: higher, description: Highest UID of system accounts}
violations:
  over: accounts.users
  as: u
  where: (u.uid >= 1 && u.uid <= params.system_uid_max || u.uid == 65534 || u.uid == 4294967294) && u.login_shell
  key: u.name
  text: >-
    u.name + " (uid " + string(u.uid) + ") has the login shell " + (u.shell == "" ? "/bin/sh (empty field)" : u.shell)
tests:
  - name: system accounts locked
    facts:
      accounts: {users: [{name: root, uid: 0, shell: /bin/bash, login_shell: true}, {name: daemon, uid: 1, shell: /usr/sbin/nologin}]}
    want: PASS
  - name: service with a shell
    facts:
      accounts: {users: [{name: root, uid: 0, shell: /bin/bash, login_shell: true}, {name: postgres, uid: 26, shell: /bin/bash, login_shell: true}]}
    want: FAIL
  - name: nobody with a shell
    facts:
      accounts: {users: [{name: root, uid: 0, shell: /bin/bash, login_shell: true}, {name: nobody, uid: 65534, shell: /bin/bash, login_shell: true}, {name: alice, uid: 1000, shell: /bin/bash, login_shell: true}]}
    want: FAIL
  - name: partial list cannot pass
    input: incomplete
    incomplete: [accounts]
    facts:
      accounts: {users: [{name: root, uid: 0, login_shell: true}]}
    want: ERROR
