id: accounts.system-account-shells
version: 1
title: System accounts cannot log in
title_ko: 로그인이 필요 없는 계정의 쉘 제한
severity: low
description: >-
  Lists system accounts (UID 1 to `system_uid_max`) that have a login shell instead of
  nologin or false.
rationale: A service account with a shell gives an attacker who reaches it an interactive foothold.
remediation: Set the shell to /usr/sbin/nologin (usermod -s /usr/sbin/nologin account).
params:
  system_uid_max: {type: int, default: 999, stricter: higher, description: Highest UID of system accounts}
violations:
  over: accounts.users
  as: u
  where: u.uid >= 1 && u.uid <= params.system_uid_max && u.login_shell
  key: u.name
  text: >-
    u.name + " (uid " + string(u.uid) + ") has the login shell " + (u.shell == "" ? "/bin/sh (empty field)" : u.shell)
tests:
  - name: system accounts locked
    facts:
      accounts: {users: [{name: root, uid: 0, shell: /bin/bash, login_shell: true}, {name: daemon, uid: 1, shell: /usr/sbin/nologin}]}
    want: PASS
  - name: service with a shell
    facts:
      accounts: {users: [{name: root, uid: 0, shell: /bin/bash, login_shell: true}, {name: postgres, uid: 26, shell: /bin/bash, login_shell: true}]}
    want: FAIL
  - name: partial list cannot pass
    input: incomplete
    incomplete: [accounts]
    facts:
      accounts: {users: [{name: root, uid: 0, login_shell: true}]}
    want: ERROR
