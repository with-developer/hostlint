id: accounts.password-complexity
version: 1
title: Passwords mix letters, digits and special characters
title_ko: 비밀번호에 영문자·숫자·특수문자를 섞어 씀
severity: high
description: >-
  Checks that password quality, not in warning-only mode, requires at least one digit, one
  special character and one letter (upper or lower case): dcredit, ocredit and ucredit or
  lcredit set to -1 or less, or minclass 4 (every character class), or minclass 3 together with
  dcredit and ocredit (a letter is then the third class).
rationale: Passwords drawn from one character class are far easier to guess.
remediation: >-
  Set `dcredit = -1`, `ocredit = -1`, `ucredit = -1` and `lcredit = -1` (or
  `minclass = 4`, or `minclass = 3` with `dcredit = -1` and `ocredit = -1`) in
  /etc/security/pwquality.conf.
expect: >-
  pam.password_quality.module != "" &&
  (!("enforcing" in pam.password_quality.settings) || pam.password_quality.settings.enforcing.value != "0") &&
  (("minclass" in pam.password_quality.settings && int(pam.password_quality.settings.minclass.value) >= 4) ||
   ("minclass" in pam.password_quality.settings && int(pam.password_quality.settings.minclass.value) >= 3 &&
    int(pam.password_quality.settings.dcredit.value) <= -1 && int(pam.password_quality.settings.ocredit.value) <= -1) ||
   (int(pam.password_quality.settings.dcredit.value) <= -1 &&
    int(pam.password_quality.settings.ocredit.value) <= -1 &&
    (int(pam.password_quality.settings.ucredit.value) <= -1 ||
     int(pam.password_quality.settings.lcredit.value) <= -1)))
tests:
  - name: all classes required
    facts:
      pam: {password_quality: {module: pam_pwquality.so, settings: {dcredit: {value: "-1"}, ocredit: {value: "-1"}, ucredit: {value: "-1"}, lcredit: {value: "-1"}, minclass: {value: "0"}, enforcing: {value: "1"}}}}
    want: PASS
  - name: lower case is enough for letters
    facts:
      pam: {password_quality: {module: pam_pwquality.so, settings: {dcredit: {value: "-1"}, ocredit: {value: "-2"}, ucredit: {value: "0"}, lcredit: {value: "-1"}, minclass: {value: "0"}, enforcing: {value: "1"}}}}
    want: PASS
  - name: four classes by minclass
    facts:
      pam: {password_quality: {module: pam_pwquality.so, settings: {dcredit: {value: "0"}, ocredit: {value: "0"}, ucredit: {value: "0"}, lcredit: {value: "0"}, minclass: {value: "4", explicit: true}, enforcing: {value: "1"}}}}
    want: PASS
  - name: three classes with a digit and a special character
    facts:
      pam: {password_quality: {module: pam_pwquality.so, settings: {dcredit: {value: "-1"}, ocredit: {value: "-1"}, ucredit: {value: "0"}, lcredit: {value: "0"}, minclass: {value: "3", explicit: true}, enforcing: {value: "1"}}}}
    want: PASS
  - name: three classes without requiring a digit
    facts:
      pam: {password_quality: {module: pam_pwquality.so, settings: {dcredit: {value: "0"}, ocredit: {value: "-1"}, ucredit: {value: "0"}, lcredit: {value: "0"}, minclass: {value: "3", explicit: true}, enforcing: {value: "1"}}}}
    want: FAIL
  - name: defaults require nothing
    facts:
      pam: {password_quality: {module: pam_pwquality.so, settings: {dcredit: {value: "0"}, ocredit: {value: "0"}, ucredit: {value: "0"}, lcredit: {value: "0"}, minclass: {value: "0"}, enforcing: {value: "1"}}}}
    want: FAIL
  - name: no special character required
    facts:
      pam: {password_quality: {module: pam_pwquality.so, settings: {dcredit: {value: "-1"}, ocredit: {value: "0"}, ucredit: {value: "-1"}, lcredit: {value: "-1"}, minclass: {value: "3"}, enforcing: {value: "1"}}}}
    want: FAIL
  - name: warning only
    facts:
      pam: {password_quality: {module: pam_pwquality.so, settings: {dcredit: {value: "-1"}, ocredit: {value: "-1"}, ucredit: {value: "-1"}, lcredit: {value: "-1"}, minclass: {value: "0"}, enforcing: {value: "0", explicit: true}}}}
    want: FAIL
  - name: credits unknown
    input: absent
    facts:
      pam: {password_quality: {module: pam_cracklib.so, settings: {}}}
    want: ERROR
