id: accounts.password-complexity
version: 1
title: Passwords mix letters, digits and special characters
title_ko: 비밀번호 복잡성(영문·숫자·특수문자) 설정
severity: high
description: >-
  Checks that password quality requires at least one digit, one special character and one
  letter (upper or lower case): dcredit, ocredit and ucredit or lcredit set to -1 or less.
rationale: Passwords drawn from one character class are far easier to guess.
remediation: >-
  Set `dcredit = -1`, `ocredit = -1`, `ucredit = -1` and `lcredit = -1` in
  /etc/security/pwquality.conf.
expect: >-
  pam.password_quality.module != "" &&
  int(pam.password_quality.settings.dcredit.value) <= -1 &&
  int(pam.password_quality.settings.ocredit.value) <= -1 &&
  (int(pam.password_quality.settings.ucredit.value) <= -1 ||
   int(pam.password_quality.settings.lcredit.value) <= -1)
tests:
  - name: all classes required
    facts:
      pam: {password_quality: {module: pam_pwquality.so, settings: {dcredit: {value: "-1"}, ocredit: {value: "-1"}, ucredit: {value: "-1"}, lcredit: {value: "-1"}}}}
    want: PASS
  - name: lower case is enough for letters
    facts:
      pam: {password_quality: {module: pam_pwquality.so, settings: {dcredit: {value: "-1"}, ocredit: {value: "-2"}, ucredit: {value: "0"}, lcredit: {value: "-1"}}}}
    want: PASS
  - name: defaults require nothing
    facts:
      pam: {password_quality: {module: pam_pwquality.so, settings: {dcredit: {value: "0"}, ocredit: {value: "0"}, ucredit: {value: "0"}, lcredit: {value: "0"}}}}
    want: FAIL
  - name: no special character required
    facts:
      pam: {password_quality: {module: pam_pwquality.so, settings: {dcredit: {value: "-1"}, ocredit: {value: "0"}, ucredit: {value: "-1"}, lcredit: {value: "-1"}}}}
    want: FAIL
  - name: credits unknown
    input: absent
    facts:
      pam: {password_quality: {module: pam_cracklib.so, settings: {}}}
    want: ERROR
