id: accounts.password-quality-root
version: 1
title: Password quality also applies to root
title_ko: 비밀번호 품질 검사가 root에도 적용됨
severity: medium
description: >-
  Checks that the password-quality module, not in warning-only mode, has enforce_for_root, so
  root cannot set a weak password after the warning.
rationale: Without enforce_for_root, quality rules only warn when root changes a password.
remediation: >-
  Add `enforce_for_root` to /etc/security/pwquality.conf. On CentOS/RHEL 7 (libpwquality 1.2) that file
  has no such setting: add it as an argument of the pam_pwquality line in /etc/pam.d/system-auth and
  password-auth instead.
expect: >-
  pam.password_quality.module != "" && (!("enforcing" in pam.password_quality.settings) || pam.password_quality.settings.enforcing.value != "0") && "enforce_for_root" in pam.password_quality.settings
tests:
  - name: enforced for root
    facts:
      pam: {password_quality: {module: pam_pwquality.so, settings: {enforce_for_root: {value: "1", explicit: true}, enforcing: {value: "1"}}}}
    want: PASS
  - name: not enforced
    facts:
      pam: {password_quality: {module: pam_pwquality.so, settings: {enforcing: {value: "1"}}}}
    want: FAIL
  - name: warning only
    facts:
      pam: {password_quality: {module: pam_pwquality.so, settings: {enforce_for_root: {value: "1", explicit: true}, enforcing: {value: "0", explicit: true}}}}
    want: FAIL
  - name: PAM incomplete
    input: incomplete
    incomplete: [pam]
    facts:
      pam: {password_quality: {module: pam_pwquality.so, settings: {enforce_for_root: {value: "1"}}}}
    want: ERROR
