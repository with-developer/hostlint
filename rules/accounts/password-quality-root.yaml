id: accounts.password-quality-root
version: 1
title: Password quality also applies to root
title_ko: root 계정에도 비밀번호 복잡성 적용
severity: medium
description: >-
  Checks that the password-quality module has enforce_for_root, so root cannot set a weak
  password after the warning.
rationale: Without enforce_for_root, quality rules only warn when root changes a password.
remediation: Add `enforce_for_root` to /etc/security/pwquality.conf.
expect: >-
  pam.password_quality.module != "" && "enforce_for_root" in pam.password_quality.settings
tests:
  - name: enforced for root
    facts:
      pam: {password_quality: {module: pam_pwquality.so, settings: {enforce_for_root: {value: "1", explicit: true}}}}
    want: PASS
  - name: not enforced
    facts:
      pam: {password_quality: {module: pam_pwquality.so, settings: {}}}
    want: FAIL
  - name: PAM incomplete
    input: incomplete
    incomplete: [pam]
    facts:
      pam: {password_quality: {module: pam_pwquality.so, settings: {enforce_for_root: {value: "1"}}}}
    want: ERROR
