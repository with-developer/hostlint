id: accounts.session-timeout-value
version: 2
title: The idle timeout is short enough
title_ko: 유휴 시간 제한이 충분히 짧음
severity: low
description: >-
  Lists TMOUT assignments that are empty, zero or longer than `max_seconds`, and unset TMOUT
  commands, including those inside if or case blocks, which can apply to some sessions.
description_ko: >-
  비어 있거나 0이거나 `max_seconds`보다 긴 TMOUT 대입과, TMOUT을 unset하는 명령을 나열합니다. 일부 세션에만 적용될 수 있는 if나 case 블록
  안의 것도 포함합니다.
rationale: A long or disabled timeout leaves idle sessions open.
rationale_ko: >-
  제한 시간이 길거나 꺼져 있으면 유휴 세션이 열린 채 남습니다.
remediation: >-
  Set `TMOUT` to the required number of seconds (600 or less by default; a stricter profile or configuration asks for
  fewer) and remove larger assignments and unset commands.
remediation_ko: >-
  `TMOUT`을 요구하는 초 단위 값으로 설정하고(기본값은 600초 이하이며, 더 엄격한 프로파일이나 설정은 더 짧게 요구합니다), 더 큰 값의 대입과 unset 명령은
  지우세요.
params:
  max_seconds: {type: int, default: 600, stricter: lower, description: Longest acceptable idle timeout in seconds}
violations:
  over: shell_env.tmout
  as: t
  where: >-
    t.unset || t.value == "" || int(t.value) < 1 || int(t.value) > params.max_seconds
  key: t.source
  text: >-
    (t.unset ? "unset TMOUT" : t.value == "" ? "TMOUT is empty or not a plain number (an expansion?): review it" : "TMOUT=" + t.value) + (t.conditional ? " (conditional)" : "") + " at " + t.source
  allow_empty: true
tests:
  - name: ten minutes
    facts:
      shell_env: {tmout: [{value: "600", source: "/etc/profile.d/timeout.sh:1"}]}
    want: PASS
  - name: an hour
    facts:
      shell_env: {tmout: [{value: "3600", source: "/etc/profile:80"}]}
    want: FAIL
  - name: disabled for some sessions
    facts:
      shell_env: {tmout: [{value: "600", source: "/etc/profile.d/timeout.sh:1"}, {value: "0", conditional: true, source: "/root/.bashrc:3"}]}
    want: FAIL
  - name: unset
    facts:
      shell_env: {tmout: [{value: "600", source: "/etc/profile.d/timeout.sh:1"}, {unset: true, source: "/root/.bashrc:5"}]}
    want: FAIL
  - name: incomplete without a bad value cannot pass
    input: incomplete
    incomplete: [shell_env]
    facts:
      shell_env: {tmout: [{value: "300"}]}
    want: ERROR
