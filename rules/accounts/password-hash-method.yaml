id: accounts.password-hash-method
version: 2
title: New passwords use a strong hash
title_ko: 새 비밀번호가 강한 해시를 씀
severity: medium
description: >-
  Checks that new passwords get a SHA-2, yescrypt or bcrypt hash: the hashing option of pam_unix in the
  passwd stack, which overrides login.defs for passwd, and ENCRYPT_METHOD in /etc/login.defs,
  used by the other shadow-utils tools. ENCRYPT_METHOD YESCRYPT only counts where shadow-utils
  is built with yescrypt (Debian 12, Ubuntu 24.04, RHEL 10 and their successors); elsewhere,
  such as RHEL 9 and Ubuntu 22.04, it falls back to DES.
rationale: Passwords hashed with DES or MD5 crypt can be cracked quickly once the hash leaks.
remediation: >-
  Set `ENCRYPT_METHOD SHA512` in /etc/login.defs, use sha512 or yescrypt on the pam_unix
  password line, then have users change their passwords.
expect: >-
  (!has(pam.effective.password_hash) || pam.effective.password_hash.value in ["sha512", "sha256", "yescrypt", "gost_yescrypt", "blowfish"]) &&
  has(login_defs.settings.ENCRYPT_METHOD) &&
  (login_defs.settings.ENCRYPT_METHOD.value in ["SHA512", "SHA256"] ||
   (login_defs.settings.ENCRYPT_METHOD.value == "YESCRYPT" &&
    ((os.id == "debian" && os.version_major >= 12) || (os.id == "ubuntu" && os.version_major >= 24) ||
     (os.family == "rhel" && os.version_major >= 10))))
tests:
  - name: sha512 everywhere
    facts:
      pam: {effective: {password_hash: {value: sha512, explicit: true}}}
      login_defs: {present: true, settings: {ENCRYPT_METHOD: {value: SHA512, explicit: true}}}
    want: PASS
  - name: yescrypt on Debian 12
    facts:
      pam: {effective: {password_hash: {value: yescrypt, explicit: true}}}
      login_defs: {present: true, settings: {ENCRYPT_METHOD: {value: YESCRYPT, explicit: true}}}
    want: PASS
  - name: gost-yescrypt and blowfish on the pam_unix line are strong
    facts:
      pam: {effective: {password_hash: {value: gost_yescrypt, explicit: true}}}
      login_defs: {present: true, settings: {ENCRYPT_METHOD: {value: SHA512, explicit: true}}}
    want: PASS
  - name: blowfish on the pam_unix line
    facts:
      pam: {effective: {password_hash: {value: blowfish, explicit: true}}}
      login_defs: {present: true, settings: {ENCRYPT_METHOD: {value: SHA512, explicit: true}}}
    want: PASS
  - name: pam_unix follows login.defs
    facts:
      pam: {}
      login_defs: {present: true, settings: {ENCRYPT_METHOD: {value: SHA512, explicit: true}}}
    want: PASS
  - name: yescrypt by default on EL10
    facts:
      os: {id: almalinux, id_like: [rhel, centos, fedora], version_id: "10.0", version_major: 10, family: rhel, supported: true}
      pam: {effective: {password_hash: {value: yescrypt, explicit: true}}}
      login_defs: {present: true, settings: {ENCRYPT_METHOD: {value: YESCRYPT, explicit: true}}}
    want: PASS
  - name: YESCRYPT falls back to DES on EL9
    os: rhel
    facts:
      pam: {effective: {password_hash: {value: sha512, explicit: true}}}
      login_defs: {present: true, settings: {ENCRYPT_METHOD: {value: YESCRYPT, explicit: true}}}
    want: FAIL
  - name: pam_unix md5 overrides login.defs
    facts:
      pam: {effective: {password_hash: {value: md5, explicit: true}}}
      login_defs: {present: true, settings: {ENCRYPT_METHOD: {value: SHA512, explicit: true}}}
    want: FAIL
  - name: md5
    facts:
      pam: {}
      login_defs: {present: true, settings: {ENCRYPT_METHOD: {value: MD5, explicit: true}}}
    want: FAIL
  - name: not set
    input: absent
    facts:
      pam: {}
      login_defs: {present: true, settings: {}}
    want: FAIL
  - name: PAM unreadable
    input: unavailable
    unavailable: [pam]
    facts:
      login_defs: {present: true, settings: {ENCRYPT_METHOD: {value: SHA512, explicit: true}}}
    want: ERROR
