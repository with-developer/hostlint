id: accounts.password-hash-method
version: 1
title: New passwords use a strong hash
title_ko: 안전한 비밀번호 암호화 알고리즘 설정
severity: medium
description: Checks ENCRYPT_METHOD in /etc/login.defs (SHA-2 based or stronger).
rationale: Passwords hashed with DES or MD5 crypt can be cracked quickly once the hash leaks.
remediation: Set `ENCRYPT_METHOD SHA512` (or YESCRYPT) in /etc/login.defs, then have users change their passwords.
setting:
  fact: login_defs.settings.ENCRYPT_METHOD
  in: [SHA256, SHA512, YESCRYPT, GOST_YESCRYPT, SCRYPT, BCRYPT]
  absent: fail
tests:
  - name: yescrypt
    facts:
      login_defs: {present: true, settings: {ENCRYPT_METHOD: {value: YESCRYPT, explicit: true}}}
    want: PASS
  - name: md5
    facts:
      login_defs: {present: true, settings: {ENCRYPT_METHOD: {value: MD5, explicit: true}}}
    want: FAIL
  - name: not set
    input: absent
    facts:
      login_defs: {present: true, settings: {}}
    want: FAIL
