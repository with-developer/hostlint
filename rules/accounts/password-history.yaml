id: accounts.password-history
version: 1
title: Recent passwords cannot be reused
title_ko: 최근 비밀번호를 다시 쓸 수 없음
severity: medium
description: >-
  Checks that the passwd service rejects any of the last `remember` passwords, also when root
  sets the password: pam_pwhistory with enforce_for_root, whose rejection keeps pam_unix from
  storing the password. pam_unix's remember option does not count, since pam_unix skips the
  check when root changes a password.
rationale: Reusing old passwords brings back credentials that may already be known.
remediation: >-
  Enable pam_pwhistory before pam_unix in the password stack and set `remember = 4` (or more)
  and `enforce_for_root` in /etc/security/pwhistory.conf or on the module line.
params:
  remember: {type: int, default: 4, stricter: higher, description: Number of previous passwords remembered}
expect: >-
  pam.password_history.module == "pam_pwhistory.so" &&
  has(pam.password_history.settings.enforce_for_root) &&
  int(pam.password_history.settings.remember.value) >= params.remember
tests:
  - name: five remembered, also for root
    facts:
      pam: {password_history: {module: pam_pwhistory.so, settings: {remember: {value: "5", explicit: true}, enforce_for_root: {value: "1", explicit: true}}}}
    want: PASS
  - name: root may reuse passwords
    facts:
      pam: {password_history: {module: pam_pwhistory.so, settings: {remember: {value: "5", explicit: true}}}}
    want: FAIL
  - name: pam_unix remember skips root
    facts:
      pam: {password_history: {module: pam_unix.so, settings: {remember: {value: "5", explicit: true}}}}
    want: FAIL
  - name: no history module
    facts:
      pam: {password_history: {module: "", settings: {}}}
    want: FAIL
  - name: too few
    facts:
      pam: {password_history: {module: pam_unix.so, settings: {remember: {value: "2", explicit: true}}}}
    want: FAIL
  - name: PAM unreadable
    input: unavailable
    unavailable: [pam]
    want: ERROR
