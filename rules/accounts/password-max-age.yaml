id: accounts.password-max-age
version: 1
title: Passwords expire
title_ko: 비밀번호가 만료됨
severity: medium
description: >-
  Checks PASS_MAX_DAYS in /etc/login.defs, the maximum password age given to new accounts.
  Without it, shadow-utils uses -1, which means passwords never expire.
description_ko: >-
  /etc/login.defs의 PASS_MAX_DAYS, 즉 새 계정에 주는 비밀번호 최대 사용 기간을 확인합니다. 이 값이 없으면 shadow-utils는 -1을 쓰는데,
  비밀번호가 만료되지 않는다는 뜻입니다.
rationale: A password that never changes stays useful to whoever obtained it.
rationale_ko: >-
  바뀌지 않는 비밀번호는 그것을 알아낸 사람에게 계속 쓸모가 있습니다.
remediation: Set `PASS_MAX_DAYS 90` (or less) in /etc/login.defs; apply it to existing accounts with chage.
remediation_ko: >-
  /etc/login.defs에 `PASS_MAX_DAYS 90`(또는 그보다 작은 값)을 설정하고, 이미 있는 계정에는 chage로 적용하세요.
params:
  max_days: {type: int, default: 90, stricter: lower, description: Maximum password age in days}
setting:
  fact: login_defs.settings.PASS_MAX_DAYS
  range: {min: 1, max: params.max_days}
  absent: default
tests:
  - name: ninety days
    facts:
      login_defs: {present: true, settings: {PASS_MAX_DAYS: {value: "90", explicit: true, source: "/etc/login.defs:165"}}}
    want: PASS
  - name: never expires (Debian default)
    facts:
      login_defs: {present: true, settings: {PASS_MAX_DAYS: {value: "99999", explicit: true}}}
    want: FAIL
  - name: a value shadow-utils cannot read
    facts:
      login_defs: {present: true, settings: {PASS_MAX_DAYS: {value: "invalid: 090", explicit: true, source: "/etc/login.defs:165"}}}
    want: FAIL
  - name: unset means no limit
    input: absent
    facts:
      login_defs: {present: false, settings: {PASS_MAX_DAYS: {value: "-1", source: "default (login.defs(5))"}}}
    want: FAIL
