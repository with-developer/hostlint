id: accounts.unique-uids
version: 1
title: Every account has its own UID
title_ko: 동일한 UID 금지
severity: medium
description: Lists accounts that share a UID with another account.
rationale: Accounts sharing a UID are the same user to the kernel, so access and audit trails cannot tell them apart.
remediation: Give each account a unique UID (usermod -u) and fix the ownership of its files.
violations:
  over: accounts.users
  as: u
  where: accounts.users.filter(o, o.uid == u.uid).size() > 1
  key: u.name
  text: >-
    u.name + " shares UID " + string(u.uid) + " with " +
    accounts.users.filter(o, o.uid == u.uid && o.name != u.name).map(o, o.name).join(", ")
tests:
  - name: unique
    facts:
      accounts: {users: [{name: root, uid: 0}, {name: alice, uid: 1000}, {name: bob, uid: 1001}]}
    want: PASS
  - name: shared
    facts:
      accounts: {users: [{name: alice, uid: 1000}, {name: alice2, uid: 1000}]}
    want: FAIL
  - name: accounts unreadable
    input: unavailable
    unavailable: [accounts]
    want: ERROR
