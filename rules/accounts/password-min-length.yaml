id: accounts.password-min-length
version: 1
title: Passwords have a minimum length
title_ko: 비밀번호 최소 길이 설정
severity: high
description: >-
  Checks that the passwd service's PAM stack enforces password quality (pam_pwquality or
  pam_cracklib) with a minimum length of at least `min_length` characters.
rationale: Short passwords fall quickly to guessing and offline cracking.
remediation: >-
  Enable pam_pwquality in the password stack (authselect, pam-auth-update) and set
  `minlen = 8` or more in /etc/security/pwquality.conf.
params:
  min_length: {type: int, default: 8, stricter: higher, description: Minimum password length}
expect: >-
  pam.password_quality.module != "" &&
  int(pam.password_quality.settings.minlen.value) >= params.min_length
tests:
  - name: default minimum length
    facts:
      pam: {password_quality: {module: pam_pwquality.so, settings: {minlen: {value: "8", source: "default (pwquality.conf(5))"}}}}
    want: PASS
  - name: too short
    facts:
      pam: {password_quality: {module: pam_pwquality.so, settings: {minlen: {value: "6", explicit: true}}}}
    want: FAIL
  - name: no quality module
    facts:
      pam: {password_quality: {module: "", settings: {}}}
    want: FAIL
  - name: stricter local policy
    params: {min_length: 12}
    facts:
      pam: {password_quality: {module: pam_pwquality.so, settings: {minlen: {value: "10", explicit: true}}}}
    want: FAIL
  - name: PAM unreadable
    input: unavailable
    unavailable: [pam]
    want: ERROR
