id: accounts.password-min-length
version: 1
title: Passwords have a minimum length
title_ko: 비밀번호 최소 길이 설정
severity: high
description: >-
  Checks that the passwd service's PAM stack enforces password quality (pam_pwquality or
  pam_cracklib, not in warning-only mode) with a minimum length of at least `min_length`
  characters. Positive credits let a password be shorter by up to their sum, so they count
  against minlen.
rationale: Short passwords fall quickly to guessing and offline cracking.
remediation: >-
  Enable pam_pwquality in the password stack (authselect, pam-auth-update), set
  `minlen = 8` or more in /etc/security/pwquality.conf, and do not set enforcing = 0 or
  positive credits.
params:
  min_length: {type: int, default: 8, stricter: higher, description: Minimum password length}
expect: >-
  pam.password_quality.module != "" &&
  (!("enforcing" in pam.password_quality.settings) || pam.password_quality.settings.enforcing.value != "0") &&
  int(pam.password_quality.settings.minlen.value) -
    math.greatest(0, int(pam.password_quality.settings.dcredit.value)) -
    math.greatest(0, int(pam.password_quality.settings.ucredit.value)) -
    math.greatest(0, int(pam.password_quality.settings.lcredit.value)) -
    math.greatest(0, int(pam.password_quality.settings.ocredit.value)) >= params.min_length
tests:
  - name: default minimum length
    facts:
      pam: {password_quality: {module: pam_pwquality.so, settings: {minlen: {value: "8", source: "default (pwquality.conf(5))"}, dcredit: {value: "0"}, ucredit: {value: "0"}, lcredit: {value: "0"}, ocredit: {value: "0"}, enforcing: {value: "1"}}}}
    want: PASS
  - name: too short
    facts:
      pam: {password_quality: {module: pam_pwquality.so, settings: {minlen: {value: "6", explicit: true}, dcredit: {value: "0"}, ucredit: {value: "0"}, lcredit: {value: "0"}, ocredit: {value: "0"}, enforcing: {value: "1"}}}}
    want: FAIL
  - name: positive credits shorten the minimum
    facts:
      pam: {password_quality: {module: pam_pwquality.so, settings: {minlen: {value: "10", explicit: true}, dcredit: {value: "1"}, ucredit: {value: "1"}, lcredit: {value: "1"}, ocredit: {value: "1"}, enforcing: {value: "1"}}}}
    want: FAIL
  - name: warning only
    facts:
      pam: {password_quality: {module: pam_pwquality.so, settings: {minlen: {value: "14", explicit: true}, dcredit: {value: "0"}, ucredit: {value: "0"}, lcredit: {value: "0"}, ocredit: {value: "0"}, enforcing: {value: "0", explicit: true}}}}
    want: FAIL
  - name: no quality module
    facts:
      pam: {password_quality: {module: "", settings: {}}}
    want: FAIL
  - name: stricter local policy
    params: {min_length: 12}
    facts:
      pam: {password_quality: {module: pam_pwquality.so, settings: {minlen: {value: "10", explicit: true}, dcredit: {value: "0"}, ucredit: {value: "0"}, lcredit: {value: "0"}, ocredit: {value: "0"}, enforcing: {value: "1"}}}}
    want: FAIL
  - name: cracklib credits unknown
    input: absent
    facts:
      pam: {password_quality: {module: pam_cracklib.so, settings: {minlen: {value: "14", explicit: true}}}}
    want: ERROR
  - name: PAM unreadable
    input: unavailable
    unavailable: [pam]
    want: ERROR
