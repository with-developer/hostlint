id: accounts.review-login-accounts
version: 1
title: Review accounts that can log in
title_ko: 로그인할 수 있는 계정 검토
severity: low
description: Lists every account with a login shell, for a reviewer to confirm each is still needed.
rationale: Accounts left behind by departed users or old services are easy targets.
remediation: >-
  Remove accounts that are no longer needed (userdel). An account that must stay but should not
  log in gets a nologin shell and a locked password (usermod -L -s /usr/sbin/nologin).
manual:
  guidance: >-
    Confirm that every listed account is still needed, especially accounts of people who have
    left. Default accounts such as lp, uucp or games appear here only when they were given a
    login shell, which they should not have.
  show: >-
    accounts.users.filter(u, u.login_shell).map(u, u.name + " (uid " + string(u.uid) + ", " + (u.shell == "" ? "/bin/sh, empty field" : u.shell) + ")")
tests:
  - name: accounts with a login shell
    facts:
      accounts:
        users: [{name: root, uid: 0, shell: /bin/bash, login_shell: true}, {name: daemon, uid: 1, shell: /usr/sbin/nologin, login_shell: false}, {name: odd, uid: 1001, shell: "", login_shell: true}]
    want: MANUAL
  - name: evidence unavailable still asks for the review
    input: unavailable
    unavailable: [accounts]
    want: MANUAL
