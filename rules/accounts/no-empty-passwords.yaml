id: accounts.no-empty-passwords
version: 1
title: No account has an empty password
title_ko: 비밀번호가 비어 있는 계정이 없음
severity: high
description: >-
  Lists the accounts whose password field in /etc/shadow is empty, which means no password is needed to
  use them wherever PAM accepts it (the nullok option of pam_unix, which some default
  configurations still carry). Locked accounts ("!" or "*") are not listed. Without /etc/shadow there is
  nothing to check, so the check cannot pass.
description_ko: >-
  /etc/shadow에서 비밀번호 필드가 비어 있는 계정을 나열합니다. PAM이 허용하는 곳(pam_unix의 nullok 옵션이며, 일부 기본 설정에
  아직 들어 있습니다)에서는 비밀번호 없이 그 계정을 쓸 수 있다는 뜻입니다. 잠긴 계정("!"나 "*")은 나열하지 않습니다. /etc/shadow가
  없으면 확인할 것이 없으므로 이 점검은 통과할 수 없습니다.
rationale: >-
  An account without a password lets anyone who can reach a login prompt, a console or su use it.
rationale_ko: >-
  비밀번호가 없는 계정은 로그인 화면, 콘솔, su에 닿을 수 있는 누구나 쓸 수 있습니다.
remediation: >-
  Set a password for each listed account (`passwd user`), or lock it (`passwd -l user`). Remove `nullok`
  from the pam_unix lines in the PAM configuration so an empty password is refused.
remediation_ko: >-
  나열된 계정마다 비밀번호를 정하거나(`passwd 사용자`) 잠그세요(`passwd -l 사용자`). PAM 설정의 pam_unix 줄에서 `nullok`을 지우면 빈
  비밀번호를 거부합니다.
violations:
  over: shadow.entries
  as: e
  where: e.state == "empty"
  key: e.name
  text: >-
    e.name + " has an empty password"
tests:
  - name: every account has a password or is locked
    facts:
      shadow: {present: true, entries: [{name: root, state: set, algorithm: sha512}, {name: daemon, state: locked, algorithm: ""}]}
    want: PASS
  - name: an empty password
    facts:
      shadow: {present: true, entries: [{name: root, state: set, algorithm: sha512}, {name: guest, state: empty, algorithm: ""}]}
    want: FAIL
  - name: no shadow file
    input: absent
    facts:
      shadow: {present: false, entries: []}
    want: ERROR
  - name: shadow unreadable without root
    input: unavailable
    unavailable: [shadow]
    want: ERROR
