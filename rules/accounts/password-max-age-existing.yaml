id: accounts.password-max-age-existing
version: 1
title: Existing accounts have expiring passwords
title_ko: 기존 계정의 비밀번호가 만료됨
severity: medium
description: >-
  Lists accounts with a password whose own maximum age in /etc/shadow is empty, 0 or more than
  `max_days`. The login.defs value only applies to accounts created after it was set, so an
  existing account (root keeps 99999 on many systems) can still never expire.
rationale: A password that never changes stays useful to whoever obtained it.
remediation: Run `chage -M 90 account` for each listed account, and set `PASS_MAX_DAYS 90` in /etc/login.defs for new ones.
params:
  max_days: {type: int, default: 90, stricter: lower, description: Maximum password age in days}
violations:
  over: shadow.entries
  as: e
  where: e.state == "set" && (e.max_days < 1 || e.max_days > params.max_days)
  key: e.name
  text: >-
    e.name + " has a maximum password age of " + (e.max_days < 0 ? "none" : string(e.max_days) + " days")
tests:
  - name: every password expires in time
    facts:
      shadow: {present: true, entries: [{name: root, state: set, max_days: 90}, {name: alice, state: set, max_days: 60}, {name: daemon, state: locked, max_days: 99999}]}
    want: PASS
  - name: an account that never expires
    facts:
      shadow: {present: true, entries: [{name: root, state: set, max_days: 99999}]}
    want: FAIL
  - name: an empty field
    facts:
      shadow: {present: true, entries: [{name: alice, state: set, max_days: -1}]}
    want: FAIL
  - name: no shadow file
    input: absent
    facts:
      shadow: {present: false, entries: []}
    want: ERROR
  - name: shadow unreadable without root
    input: unavailable
    unavailable: [shadow]
    want: ERROR
