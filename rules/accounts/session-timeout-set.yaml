id: accounts.session-timeout-set
version: 1
title: Idle shells time out
title_ko: 유휴 셸이 자동으로 끝남
severity: low
description: >-
  Checks that the system-wide startup files (/etc/environment, /etc/profile and the files it
  reads, such as /etc/profile.d) leave TMOUT set to a positive number of seconds, so that it
  applies to every user's login shell: a value set only in root's own files does not count,
  assignments inside if or case blocks do not count, and a later unset removes it.
description_ko: >-
  시스템 전체 시작 파일(/etc/environment, /etc/profile과 그 파일이 읽는 /etc/profile.d 등)이 TMOUT을 양수 초로 설정해 두어서 모든
  사용자의 로그인 셸에 적용되는지 확인합니다. root 자신의 파일에만 설정한 값은 인정하지 않고, if나 case 블록 안의 대입도 인정하지 않으며, 나중에 unset하면
  설정이 사라집니다.
rationale: An unattended logged-in terminal can be used by anyone who reaches it.
rationale_ko: >-
  로그인한 채 방치된 터미널은 그 앞에 접근한 누구나 쓸 수 있습니다.
remediation: Add `TMOUT=600` and `readonly TMOUT` and `export TMOUT` to a file in /etc/profile.d.
remediation_ko: >-
  /etc/profile.d의 파일에 `TMOUT=600`, `readonly TMOUT`, `export TMOUT`을 추가하세요.
setting:
  fact: shell_env.system_effective.TMOUT
  matches: "[1-9][0-9]*"
  absent: fail
tests:
  - name: set
    facts:
      shell_env: {system_effective: {TMOUT: {value: "600", explicit: true, source: "/etc/profile.d/timeout.sh:1"}}}
    want: PASS
  - name: only in root's own files
    input: absent
    facts:
      shell_env: {effective: {TMOUT: {value: "600", explicit: true, source: "/root/.bashrc:1"}}, system_effective: {}}
    want: FAIL
  - name: disabled
    facts:
      shell_env: {system_effective: {TMOUT: {value: "0", explicit: true, source: "/etc/profile:30"}}}
    want: FAIL
  - name: not set, or only conditionally
    input: absent
    facts:
      shell_env: {tmout: [{value: "600", conditional: true, source: "/etc/profile:40"}]}
    want: FAIL
  - name: startup files incomplete
    input: incomplete
    incomplete: [shell_env]
    facts:
      shell_env: {effective: {TMOUT: {value: "600", explicit: true}}}
    want: ERROR
