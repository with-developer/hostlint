id: ssh.hostbased-authentication
version: 1
title: SSH does not trust other hosts
title_ko: SSH가 다른 호스트를 신뢰하지 않음
severity: medium
description: >-
  Checks the global HostbasedAuthentication setting of the OpenSSH server. On a live host the effective value
  comes from `sshd -T`, so the default of the installed version counts.
rationale: >-
  Host-based authentication trusts a whole machine instead of a person, so one compromised host opens every account that trusts it.
remediation: >-
  Set `HostbasedAuthentication no` in /etc/ssh/sshd_config (or a file it includes) and reload sshd.
applies: >-
  sshd.present
setting:
  fact: sshd.config.hostbasedauthentication
  in: ["no"]
  absent: default
tests:
  - name: as required
    facts:
      sshd: {present: true, config: {hostbasedauthentication: {value: "no", explicit: true, source: "/etc/ssh/sshd_config:20"}}}
    want: PASS
  - name: the default of the installed version is fine
    facts:
      sshd: {present: true, config: {hostbasedauthentication: {value: "no", source: "sshd -T (default)"}}}
    want: PASS
  - name: set the other way
    facts:
      sshd: {present: true, config: {hostbasedauthentication: {value: "yes", explicit: true, source: "/etc/ssh/sshd_config:20"}}}
    want: FAIL
  - name: no SSH server
    facts:
      sshd: {present: false}
    want: NOT_APPLICABLE
  - name: the default is unknown on a mounted root
    input: absent
    facts:
      sshd: {present: true, config: {}}
    want: ERROR
