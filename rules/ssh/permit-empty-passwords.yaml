id: ssh.permit-empty-passwords
version: 1
title: SSH does not accept empty passwords
title_ko: SSH가 빈 비밀번호를 받지 않음
severity: high
description: >-
  Checks the global PermitEmptyPasswords setting of the OpenSSH server. On a live host the effective value
  comes from `sshd -T`, so the default of the installed version counts.
description_ko: >-
  OpenSSH 서버의 전역 PermitEmptyPasswords 설정을 확인합니다. 실행 중인 호스트에서는 `sshd -T`가 알려 주는 실제 적용값을 쓰므로, 설치된
  버전의 기본값도 함께 반영됩니다.
rationale: >-
  An account without a password would let anyone log in over the network.
rationale_ko: >-
  비밀번호가 없는 계정이 있으면 누구든 네트워크를 통해 그 계정으로 로그인할 수 있습니다.
remediation: >-
  Set `PermitEmptyPasswords no` in /etc/ssh/sshd_config (or a file it includes) and reload sshd.
remediation_ko: >-
  /etc/ssh/sshd_config(또는 그 파일이 포함하는 파일)에 `PermitEmptyPasswords no`를 설정하고 sshd를 다시 불러오세요.
applies: >-
  sshd.present
setting:
  fact: sshd.config.permitemptypasswords
  in: ["no"]
  absent: default
tests:
  - name: as required
    facts:
      sshd: {present: true, config: {permitemptypasswords: {value: "no", explicit: true, source: "/etc/ssh/sshd_config:20"}}}
    want: PASS
  - name: the default of the installed version is fine
    facts:
      sshd: {present: true, config: {permitemptypasswords: {value: "no", source: "sshd -T (default)"}}}
    want: PASS
  - name: set the other way
    facts:
      sshd: {present: true, config: {permitemptypasswords: {value: "yes", explicit: true, source: "/etc/ssh/sshd_config:20"}}}
    want: FAIL
  - name: no SSH server
    facts:
      sshd: {present: false}
    want: NOT_APPLICABLE
  - name: the default is unknown on a mounted root
    input: absent
    facts:
      sshd: {present: true, config: {}}
    want: ERROR
