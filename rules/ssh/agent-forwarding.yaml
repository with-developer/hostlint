id: ssh.agent-forwarding
version: 1
title: SSH does not forward authentication agents
title_ko: SSH가 인증 에이전트를 전달하지 않음
severity: low
description: >-
  Checks the global AllowAgentForwarding setting of the OpenSSH server. OpenSSH enables agent
  forwarding by default; a compromised host could use a forwarded agent to authenticate elsewhere
  as the client user. On a live host the effective value comes from `sshd -T`. A Match block that
  switches it back on for some connections is not covered by any check yet.
description_ko: >-
  OpenSSH 서버의 전역 AllowAgentForwarding 설정을 확인합니다. OpenSSH는 에이전트 전달을 기본으로 허용하므로, 침해된 호스트에서 전달된 에이전트를
  가로채 클라이언트 사용자의 권한으로 다른 서버에 로그인할 수 있습니다. 실행 중인 호스트에서는 `sshd -T`가 알려 주는 실제 적용값을 씁니다. Match 블록이 일부
  연결에 대해 이 설정을 다시 켜는 경우는 아직 어떤 점검도 보지 않습니다.
rationale: >-
  Authentication agent forwarding exposes the client's local SSH agent socket on the server. If the server is compromised or an attacker has superuser access, they can intercept and abuse the agent socket to authenticate to other systems without possessing the private key.
rationale_ko: >-
  에이전트 전달은 클라이언트의 SSH 에이전트 소켓을 서버에 열어 둡니다. 서버가 침해되거나 관리자 권한을 가진 공격자가 있으면 그 소켓을 가로채, 개인 키를 훔치지 않고도
  다른 서버에 로그인할 수 있습니다.
remediation: >-
  Set `AllowAgentForwarding no` in /etc/ssh/sshd_config (or an included configuration file) and reload sshd.
remediation_ko: >-
  /etc/ssh/sshd_config(또는 그 파일이 포함하는 파일)에 `AllowAgentForwarding no`를 설정하고 sshd를 다시 불러오세요.
applies: >-
  sshd.present
setting:
  fact: sshd.config.allowagentforwarding
  in: ["no"]
  absent: default
tests:
  - name: agent forwarding disabled as required
    facts:
      sshd: {present: true, config: {allowagentforwarding: {value: "no", explicit: true, source: "/etc/ssh/sshd_config:25"}}}
    want: PASS
  - name: default enabled fails
    facts:
      sshd: {present: true, config: {allowagentforwarding: {value: "yes", source: "sshd -T (default)"}}}
    want: FAIL
  - name: explicit yes fails
    facts:
      sshd: {present: true, config: {allowagentforwarding: {value: "yes", explicit: true, source: "/etc/ssh/sshd_config:25"}}}
    want: FAIL
  - name: no SSH server installed
    facts:
      sshd: {present: false}
    want: NOT_APPLICABLE
  - name: config absent on mounted root
    input: absent
    facts:
      sshd: {present: true, config: {}}
    want: ERROR
