id: ssh.x11-forwarding
version: 1
title: SSH does not forward X11
title_ko: SSH가 X11을 전달하지 않음
severity: low
description: >-
  Checks the global X11Forwarding setting of the OpenSSH server. On a live host the effective value
  comes from `sshd -T`, so the default of the installed version counts.
rationale: >-
  X11 forwarding exposes the client's display to the server, and anything that controls the server can then watch or drive it.
remediation: >-
  Set `X11Forwarding no` in /etc/ssh/sshd_config (or a file it includes) and reload sshd.
applies: >-
  sshd.present
setting:
  fact: sshd.config.x11forwarding
  in: ["no"]
  absent: default
tests:
  - name: as required
    facts:
      sshd: {present: true, config: {x11forwarding: {value: "no", explicit: true, source: "/etc/ssh/sshd_config:20"}}}
    want: PASS
  - name: the default of the installed version is fine
    facts:
      sshd: {present: true, config: {x11forwarding: {value: "no", source: "sshd -T (default)"}}}
    want: PASS
  - name: set the other way
    facts:
      sshd: {present: true, config: {x11forwarding: {value: "yes", explicit: true, source: "/etc/ssh/sshd_config:20"}}}
    want: FAIL
  - name: no SSH server
    facts:
      sshd: {present: false}
    want: NOT_APPLICABLE
  - name: the default is unknown on a mounted root
    input: absent
    facts:
      sshd: {present: true, config: {}}
    want: ERROR
