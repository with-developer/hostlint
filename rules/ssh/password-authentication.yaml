id: ssh.password-authentication
version: 1
title: SSH logins do not accept passwords
title_ko: SSH 로그인이 비밀번호를 받지 않음
severity: medium
description: >-
  Checks that the OpenSSH server accepts neither PasswordAuthentication nor keyboard-interactive
  authentication, which is how a password is typed through PAM (named
  ChallengeResponseAuthentication before OpenSSH 8.7). On a live host the effective values come
  from `sshd -T`, so the defaults of the installed version count. The check is conservative: it
  also fails when keyboard-interactive is on but cannot produce a password prompt (UsePAM no).
description_ko: >-
  OpenSSH 서버가 PasswordAuthentication도, keyboard-interactive 인증(PAM을 거쳐 비밀번호를 입력하는 방식이며 OpenSSH 8.7
  전에는 ChallengeResponseAuthentication이라는 이름이었습니다)도 받지 않는지 확인합니다. 실행 중인 호스트에서는 `sshd -T`가 알려 주는 실제
  적용값을 쓰므로 설치된 버전의 기본값도 반영됩니다. 이 점검은 보수적이라, keyboard-interactive가 켜져 있어도 비밀번호 입력창을 띄울 수 없는
  경우(UsePAM no)까지 실패로 처리합니다.
rationale: >-
  A password can be guessed, reused and phished over the network; a key pair cannot be guessed
  and never leaves the client.
rationale_ko: >-
  비밀번호는 네트워크를 통해 추측당하고, 재사용되고, 피싱당할 수 있습니다. 키 쌍은 추측할 수 없고 클라이언트 밖으로 나가지도 않습니다.
remediation: >-
  Make sure every administrator can log in with a key, then set `PasswordAuthentication no` and
  `KbdInteractiveAuthentication no` in /etc/ssh/sshd_config (or a file it includes) and reload sshd.
remediation_ko: >-
  모든 관리자가 키로 로그인할 수 있는지 먼저 확인한 뒤, /etc/ssh/sshd_config(또는 그 파일이 포함하는 파일)에 `PasswordAuthentication
  no`와 `KbdInteractiveAuthentication no`를 설정하고 sshd를 다시 불러오세요.
applies: >-
  sshd.present
failure: >-
  The server still accepts a password, directly or through keyboard-interactive authentication.
expect: >-
  sshd.config.passwordauthentication.value == "no" &&
  ("kbdinteractiveauthentication" in sshd.config ?
    sshd.config.kbdinteractiveauthentication.value == "no" :
    sshd.config.challengeresponseauthentication.value == "no")
tests:
  - name: keys only
    facts:
      sshd: {present: true, config: {passwordauthentication: {value: "no", explicit: true}, kbdinteractiveauthentication: {value: "no", explicit: true}}}
    want: PASS
  - name: keys only, before OpenSSH 8.7
    facts:
      sshd: {present: true, config: {passwordauthentication: {value: "no", explicit: true}, challengeresponseauthentication: {value: "no", explicit: true}}}
    want: PASS
  - name: passwords are accepted
    facts:
      sshd: {present: true, config: {passwordauthentication: {value: "yes", source: "sshd -T (default)"}, kbdinteractiveauthentication: {value: "no", explicit: true}}}
    want: FAIL
  - name: a password can still be typed through PAM
    facts:
      sshd: {present: true, config: {passwordauthentication: {value: "no", explicit: true}, kbdinteractiveauthentication: {value: "yes", source: "sshd -T (default)"}}}
    want: FAIL
  - name: a password can still be typed through PAM, before OpenSSH 8.7
    facts:
      sshd: {present: true, config: {passwordauthentication: {value: "no", explicit: true}, challengeresponseauthentication: {value: "yes", explicit: true}}}
    want: FAIL
  - name: no SSH server
    facts:
      sshd: {present: false}
    want: NOT_APPLICABLE
  - name: defaults are unknown on a mounted root
    input: absent
    facts:
      sshd: {present: true, config: {}}
    want: ERROR
