id: ssh.permit-root-login
version: 1
title: SSH does not allow direct root login
title_ko: SSH root 직접 로그인 차단
severity: high
description: >-
  Checks the global PermitRootLogin setting of the OpenSSH server. On a live host the
  effective value comes from `sshd -T`, so the default of the installed version counts.
description_ko: >-
  OpenSSH 서버의 전역 PermitRootLogin 설정을 확인합니다. 실행 중인 호스트에서는 `sshd -T`가 알려 주는 실제 적용값을 쓰므로, 설치된 버전의
  기본값도 함께 반영됩니다.
rationale: >-
  Direct root logins remove accountability and expose the most privileged account to
  password guessing and stolen keys.
rationale_ko: >-
  root로 직접 로그인하면 누가 접속했는지 추적할 수 없고, 가장 강한 권한을 가진 계정이 비밀번호 추측과 키 유출에 그대로 노출됩니다.
remediation: >-
  Set `PermitRootLogin no` in /etc/ssh/sshd_config (or a file it includes) and reload sshd.
  Administrators log in with their own accounts and use sudo or su.
remediation_ko: >-
  /etc/ssh/sshd_config(또는 그 파일이 포함하는 파일)에 `PermitRootLogin no`를 설정하고 sshd를 다시 불러오세요. 관리자는 각자의 계정으로
  로그인한 뒤 sudo나 su를 사용합니다.
applies: >-
  sshd.present
setting:
  fact: sshd.config.permitrootlogin
  in: ["no"]
  absent: default
tests:
  - name: disabled
    facts:
      sshd: {present: true, config: {permitrootlogin: {value: "no", explicit: true, source: "/etc/ssh/sshd_config:32"}}}
    want: PASS
  - name: allowed
    facts:
      sshd: {present: true, config: {permitrootlogin: {value: "yes", explicit: true}}}
    want: FAIL
  - name: key-only root login is still direct root login
    facts:
      sshd: {present: true, config: {permitrootlogin: {value: prohibit-password, source: "sshd -T (default)"}}}
    want: FAIL
  - name: no SSH server
    facts:
      sshd: {present: false}
    want: NOT_APPLICABLE
  - name: default unknown on a mounted root
    input: absent
    facts:
      sshd: {present: true, config: {}}
    want: ERROR
