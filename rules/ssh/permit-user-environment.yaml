id: ssh.permit-user-environment
version: 1
title: SSH does not let users set the environment
title_ko: SSH가 사용자의 환경 변수 설정을 허용하지 않음
severity: medium
description: >-
  Checks the global PermitUserEnvironment setting of the OpenSSH server. On a live host the effective value
  comes from `sshd -T`, so the default of the installed version counts.
description_ko: >-
  OpenSSH 서버의 전역 PermitUserEnvironment 설정을 확인합니다. 실행 중인 호스트에서는 `sshd -T`가 알려 주는 실제 적용값을 쓰므로, 설치된
  버전의 기본값도 함께 반영됩니다.
rationale: >-
  Environment settings from a user's own files can change how the login shell and PAM modules behave, which defeats restrictions set for the account.
rationale_ko: >-
  사용자가 자기 파일로 지정하는 환경 변수는 로그인 셸과 PAM 모듈의 동작을 바꿀 수 있어서, 그 계정에 걸어 둔 제한을 무력화합니다.
remediation: >-
  Set `PermitUserEnvironment no` in /etc/ssh/sshd_config (or a file it includes) and reload sshd.
remediation_ko: >-
  /etc/ssh/sshd_config(또는 그 파일이 포함하는 파일)에 `PermitUserEnvironment no`를 설정하고 sshd를 다시 불러오세요.
applies: >-
  sshd.present
setting:
  fact: sshd.config.permituserenvironment
  in: ["no"]
  absent: default
tests:
  - name: as required
    facts:
      sshd: {present: true, config: {permituserenvironment: {value: "no", explicit: true, source: "/etc/ssh/sshd_config:20"}}}
    want: PASS
  - name: the default of the installed version is fine
    facts:
      sshd: {present: true, config: {permituserenvironment: {value: "no", source: "sshd -T (default)"}}}
    want: PASS
  - name: set the other way
    facts:
      sshd: {present: true, config: {permituserenvironment: {value: "yes", explicit: true, source: "/etc/ssh/sshd_config:20"}}}
    want: FAIL
  - name: no SSH server
    facts:
      sshd: {present: false}
    want: NOT_APPLICABLE
  - name: the default is unknown on a mounted root
    input: absent
    facts:
      sshd: {present: true, config: {}}
    want: ERROR
