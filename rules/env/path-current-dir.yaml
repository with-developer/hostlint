id: env.path-current-dir
version: 2
title: PATH does not search the current directory first
title_ko: PATH에서 현재 디렉터리를 먼저 찾지 않음
severity: high
description: >-
  Lists PATH assignments in the system-wide and root's startup files that put the current
  directory (".", an empty entry, or a relative one such as "./bin" or "bin") anywhere but last.
description_ko: >-
  시스템 전체 시작 파일과 root의 시작 파일에서 PATH에 현재 디렉터리(".", 빈 항목, "./bin"이나 "bin" 같은 상대 경로)를 맨 뒤가 아닌 곳에 넣은
  대입을 나열합니다.
rationale: >-
  With the current directory early in PATH, a program named like a system command in the
  directory you are in runs instead of it, as you.
rationale_ko: >-
  PATH 앞쪽에 현재 디렉터리가 있으면, 지금 있는 디렉터리에 시스템 명령과 같은 이름으로 만들어 둔 프로그램이 그 명령 대신 실행됩니다. 실행하는 사람의 권한으로
  말입니다.
remediation: Remove "." , empty and relative entries from PATH, or move them to the end.
remediation_ko: >-
  PATH에서 ".", 빈 항목, 상대 경로를 지우거나 맨 뒤로 옮기세요.
violations:
  over: shell_env.path
  as: p
  where: >-
    p.value.split(":").slice(0, p.value.split(":").size() - 1).exists(e, e == "" || !(e.startsWith("/") || e.startsWith("$") || e.startsWith("~")))
  key: p.source
  text: >-
    "PATH=" + p.value + (p.conditional ? " (conditional)" : "") + " at " + p.source
  allow_empty: true
tests:
  - name: system directories
    facts:
      shell_env: {path: [{value: "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin", source: "/etc/profile:4"}]}
    want: PASS
  - name: dot at the end
    facts:
      shell_env: {path: [{value: "$PATH:.", source: "/root/.bashrc:9"}]}
    want: PASS
  - name: dot first
    facts:
      shell_env: {path: [{value: ".:$PATH", source: "/root/.bashrc:9"}]}
    want: FAIL
  - name: empty entry in the middle
    facts:
      shell_env: {path: [{value: "/usr/bin::/bin", source: "/etc/profile:4"}]}
    want: FAIL
  - name: a relative directory first
    facts:
      shell_env: {path: [{value: "./bin:/usr/bin", source: "/root/.bashrc:9"}]}
    want: FAIL
  - name: variable and home entries are absolute
    facts:
      shell_env: {path: [{value: "$HOME/bin:~/tools:${PATH}:/usr/bin", source: "/root/.bashrc:9"}]}
    want: PASS
  - name: startup files incomplete
    input: incomplete
    incomplete: [shell_env]
    facts:
      shell_env: {path: []}
    want: ERROR
