id: services.bind-restrict-transfer
version: 1
title: BIND zone transfers are restricted
title_ko: BIND 존 전송이 제한됨
severity: high
description: >-
  Lists the primary and secondary zones of /etc/named.conf (or /etc/bind/named.conf) and the files it includes that any host may transfer: no allow-transfer applies to the zone (BIND then allows everyone), or it contains any. allow-transfer is read from the zone, its view and options, and acl names are followed. The zones every installation defines for the host itself (localhost and the loopback reverse zones) are left out. Applies when BIND is started and has a configuration; another DNS server is services.review-dns-other.
rationale: >-
  A zone transfer hands over every name in the zone, which maps the network for an attacker.
remediation: >-
  Set `allow-transfer { none; };` in options and list your secondaries (or a TSIG key) in the zones that need it.
applies: >-
  bind.present && services.started.exists(s, s.service in ["named", "bind9", "named-chroot"] || s.program.matches("/named$"))
violations:
  over: bind.zones
  as: z
  where: >-
    !z.local && z.transfer == "any"
  key: z.name + "/" + z.view
  text: >-
    "zone " + z.name + (z.view != "" ? " (view " + z.view + ")" : "") + " can be transferred by any host (" + z.where + ")"
  allow_empty: true
tests:
  - name: every transfer is restricted
    facts:
      services: {started: [{service: named, name: named.service, kind: unit, source: "/etc/systemd/system/multi-user.target.wants/named.service"}]}
      bind: {present: true, zones: [{name: a.example, type: primary, view: "", transfer: restricted, update: none, local: false, where: "/etc/named.conf:9"}]}
    want: PASS
  - name: a zone anyone can transfer
    facts:
      services: {started: [{service: named, name: named.service, kind: unit, source: "/etc/systemd/system/multi-user.target.wants/named.service"}]}
      bind: {present: true, zones: [{name: a.example, type: primary, view: "", transfer: any, update: none, local: false, where: "/etc/named.conf:9"}]}
    want: FAIL
  - name: the zones of the host itself are left out
    facts:
      services: {started: [{service: named, name: named.service, kind: unit, source: "/etc/systemd/system/multi-user.target.wants/named.service"}]}
      bind: {present: true, zones: [{name: localhost, type: primary, view: "", transfer: any, update: none, local: true, where: "/etc/named.conf:9"}]}
    want: PASS
  - name: BIND is not started
    facts:
      services: {started: []}
      bind: {present: true, zones: [{name: a.example, type: primary, view: "", transfer: any, update: any, local: false, where: "/etc/named.conf:9"}]}
    want: NOT_APPLICABLE
  - name: no named.conf
    facts:
      services: {started: [{service: named, name: named.service, kind: unit, source: "/etc/systemd/system/multi-user.target.wants/named.service"}]}
      bind: {present: false, zones: []}
    want: NOT_APPLICABLE
  - name: an included file could not be read
    input: incomplete
    incomplete: [bind]
    facts:
      services: {started: [{service: named, name: named.service, kind: unit, source: "/etc/systemd/system/multi-user.target.wants/named.service"}]}
      bind: {present: true, zones: []}
    want: ERROR
