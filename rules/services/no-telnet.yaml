id: services.no-telnet
version: 1
title: Telnet is not started
title_ko: 텔넷 서비스 미사용
severity: medium
description: >-
  Lists the ways the telnet service is started: enabled units, units running now, init scripts and
  inetd/xinetd entries, found by service name or program.
rationale: >-
  Telnet sends passwords and sessions in clear text.
remediation: >-
  Disable telnet and use SSH.
violations:
  over: services.started
  as: s
  where: >-
    s.service in ["telnet", "telnetd"] || s.program.matches("/(in\\.)?telnetd$")
  key: s.kind + ":" + s.name
  text: >-
    s.name + " (" + s.kind + (s.program != "" ? ", " + s.program : "") + ") at " + s.source
  allow_empty: true
tests:
  - name: not started
    facts:
      services: {started: [{service: ssh, name: ssh.service, kind: unit, program: /usr/sbin/sshd, source: "/etc/systemd/system/multi-user.target.wants/ssh.service"}]}
    want: PASS
  - name: started
    facts:
      services: {started: [{service: telnet, name: telnet.socket, kind: unit, program: /usr/sbin/in.telnetd, source: "/etc/systemd/system/sockets.target.wants/telnet.socket"}]}
    want: FAIL
  - name: running units unknown
    input: incomplete
    incomplete: [services]
    facts:
      services: {started: []}
    want: ERROR
