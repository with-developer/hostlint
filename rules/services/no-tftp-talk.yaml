id: services.no-tftp-talk
version: 3
title: tftp and talk are not started
title_ko: tftp, talk 서비스 미사용
severity: high
description: >-
  Lists the ways the tftp, talk and ntalk services are started: enabled units, units running now, init scripts and
  inetd/xinetd entries, found by service name or program.
rationale: >-
  tftp serves files without authentication; talk is an old, unneeded chat service.
remediation: >-
  Disable them.
violations:
  over: services.started
  as: s
  where: >-
    s.service in ["tftp", "tftpd", "tftpd-hpa", "atftpd", "talk", "ntalk", "talkd"] || s.program.matches("/(in\\.)?(a?tftpd|talkd|ntalkd)$")
  key: s.kind + ":" + s.name
  text: >-
    s.name + " (" + s.kind + (s.program != "" ? ", " + s.program : "") + ") at " + s.source
  allow_empty: true
tests:
  - name: not started
    facts:
      services: {started: [{service: ssh, name: ssh.service, kind: unit, program: /usr/sbin/sshd, source: "/etc/systemd/system/multi-user.target.wants/ssh.service"}]}
    want: PASS
  - name: started
    facts:
      services: {started: [{service: tftp, name: tftp.socket, kind: unit, program: /usr/sbin/in.tftpd, source: "/etc/systemd/system/sockets.target.wants/tftp.socket"}]}
    want: FAIL
  - name: running units unknown
    input: incomplete
    incomplete: [services]
    facts:
      services: {started: []}
    want: ERROR
  - name: atftpd
    facts:
      services: {started: [{service: atftpd, name: atftpd.service, kind: unit, program: /usr/sbin/atftpd, source: "/etc/systemd/system/multi-user.target.wants/atftpd.service"}]}
    want: FAIL
