id: services.snmp-community-strong
version: 1
title: SNMP community strings are not guessable
title_ko: SNMP community 문자열은 추측하기 어려움
severity: high
description: >-
  Lists the community strings of /etc/snmp/snmpd.conf and the files it includes that are a well-known name (public, private, ...) or shorter than 8 characters. The strings themselves are never read into the result. Applies when the agent is started and the configuration is at its usual place.
description_ko: >-
  /etc/snmp/snmpd.conf와 그 파일이 포함하는 파일에서, 잘 알려진 이름(public, private 등)이거나 8자보다 짧은 community 문자열을
  나열합니다. 문자열 자체는 결과에 담지 않습니다. 에이전트가 시작되어 있고 설정이 일반적인 위치에 있을 때 적용됩니다.
rationale: >-
  Default community names are the first thing scanners try; a short one falls to guessing.
rationale_ko: >-
  기본 community 이름은 스캐너가 가장 먼저 시도하는 것이고, 짧은 문자열은 추측으로 뚫립니다.
remediation: >-
  Choose a community of at least 8 random characters, or move to SNMPv3 (services.snmp-v3-only).
remediation_ko: >-
  무작위 문자 8자 이상으로 community를 정하거나, SNMPv3으로 옮기세요(services.snmp-v3-only).
applies: >-
  snmp.present && services.started.exists(s, s.service in ["snmpd"] || s.program.matches("/snmpd$"))
violations:
  over: snmp.communities
  as: c
  where: >-
    c.weak != ""
  key: c.where
  text: >-
    c.directive + " at " + c.where + ": the community is " + c.weak
  allow_empty: true
tests:
  - name: strong strings
    facts:
      services: {started: [{service: snmpd, name: snmpd.service, kind: unit, source: "/etc/systemd/system/multi-user.target.wants/snmpd.service"}]}
      snmp: {present: true, communities: [{directive: rocommunity, weak: "", unrestricted: false, source: "10.0.0.0/8", where: "/etc/snmp/snmpd.conf:7"}], listen: [], loopback_only: false}
    want: PASS
  - name: the default name
    facts:
      services: {started: [{service: snmpd, name: snmpd.service, kind: unit, source: "/etc/systemd/system/multi-user.target.wants/snmpd.service"}]}
      snmp: {present: true, communities: [{directive: com2sec, weak: "a well-known name", unrestricted: true, source: "", where: "/etc/snmp/snmpd.conf:1"}], listen: [], loopback_only: false}
    want: FAIL
  - name: a short string
    facts:
      services: {started: [{service: snmpd, name: snmpd.service, kind: unit, source: "/etc/systemd/system/multi-user.target.wants/snmpd.service"}]}
      snmp: {present: true, communities: [{directive: rwcommunity, weak: "shorter than 8 characters", unrestricted: false, source: "localhost", where: "/etc/snmp/snmpd.conf:2"}], listen: [], loopback_only: false}
    want: FAIL
  - name: the agent is not started
    facts:
      services: {started: []}
      snmp: {present: true, communities: [{directive: rocommunity, weak: "a well-known name", unrestricted: true, where: "/etc/snmp/snmpd.conf:7"}], listen: [], loopback_only: false}
    want: NOT_APPLICABLE
  - name: no configuration at the usual place
    facts:
      services: {started: [{service: snmpd, name: snmpd.service, kind: unit, source: "/etc/systemd/system/multi-user.target.wants/snmpd.service"}]}
      snmp: {present: false, communities: [], listen: [], loopback_only: false}
    want: NOT_APPLICABLE
  - name: an included file could not be read
    input: incomplete
    incomplete: [snmp]
    facts:
      services: {started: [{service: snmpd, name: snmpd.service, kind: unit, source: "/etc/systemd/system/multi-user.target.wants/snmpd.service"}]}
      snmp: {present: true, communities: [], listen: [], loopback_only: false}
    want: ERROR
