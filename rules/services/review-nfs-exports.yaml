id: services.review-nfs-exports
version: 1
title: Review the NFS exports
title_ko: NFS 공유 설정 검토
severity: high
description: >-
  Applies when an NFS server is started; then shows how, for a review of its configuration. Not
  applicable otherwise.
rationale: >-
  An export open to everyone, or without root_squash, hands the shared files to any host on the network.
remediation: >-
  Check /etc/exports: each export is limited to the hosts that need it, never "*", and uses root_squash.
applies: >-
  services.started.exists(s, s.service in ["nfs-server", "nfs-kernel-server", "nfs", "nfsd"] || s.program.matches("/rpc\\.nfsd$"))
manual:
  guidance: >-
    Check /etc/exports: each export is limited to the hosts that need it, never "*", and uses root_squash.
  show: >-
    services.started.filter(s, s.service in ["nfs-server", "nfs-kernel-server", "nfs", "nfsd"] || s.program.matches("/rpc\\.nfsd$")).map(s, s.name + " (" + s.kind + ") at " + s.source)
tests:
  - name: not started
    facts:
      services: {started: []}
    want: NOT_APPLICABLE
  - name: started
    facts:
      services: {started: [{service: nfs-server, name: nfs-server.service, kind: unit, source: "/etc/systemd/system/multi-user.target.wants/nfs-server.service"}]}
    want: MANUAL
