id: services.unit-enabled
version: 1
title: A systemd unit that the control requires is enabled
title_ko: 점검 항목이 요구하는 systemd 유닛이 활성화되어 있음
severity: medium
description: >-
  Checks that the systemd unit named by the parameter `unit` (such as ssh.service) is enabled, so it starts at boot, and not masked.
  The profile that uses this check says which unit. Only a profile sets the parameter.
description_ko: >-
  매개변수 `unit`이 가리키는 systemd 유닛(예: ssh.service)이 활성화되어 있어 부팅할 때 시작하고, 마스크되어 있지 않은지
  확인합니다. 어느 유닛인지는 이 점검을 쓰는 프로파일이 정합니다. 매개변수는 프로파일만 정합니다.
rationale: >-
  A control that needs a service to run cannot be met if the service does not start by itself.
rationale_ko: >-
  서비스가 실행되어야 하는 점검 항목은 서비스가 저절로 시작하지 않으면 충족할 수 없습니다.
remediation: >-
  Enable the unit (`systemctl enable --now <unit>`) and unmask it if it is masked (`systemctl unmask <unit>`).
remediation_ko: >-
  유닛을 활성화하세요(`systemctl enable --now 유닛`). 마스크되어 있다면 먼저 풀어야 합니다(`systemctl unmask 유닛`).
applies: >-
  params.unit != "" && services.systemd
params:
  unit: {type: string, default: "", description: "The systemd unit that must be enabled, for example ssh.service"}
failure: >-
  The unit that the profile requires is not enabled, or is masked, or does not exist.
expect: >-
  params.unit in services.units && services.units[params.unit].enabled && !services.units[params.unit].masked
tests:
  - name: enabled
    params: {unit: ssh.service}
    facts:
      services: {systemd: true, units: {ssh.service: {enabled: true, file: /lib/systemd/system/ssh.service}}}
    want: PASS
  - name: installed but not enabled
    params: {unit: ssh.service}
    facts:
      services: {systemd: true, units: {ssh.service: {enabled: false, file: /lib/systemd/system/ssh.service}}}
    want: FAIL
  - name: masked
    params: {unit: ssh.service}
    facts:
      services: {systemd: true, units: {ssh.service: {enabled: true, masked: true}}}
    want: FAIL
  - name: no such unit
    params: {unit: ssh.service}
    facts:
      services: {systemd: true, units: {}}
    want: FAIL
  - name: the units cannot be read
    params: {unit: ssh.service}
    input: unavailable
    unavailable: [services]
    facts:
      services: {systemd: true, units: {}}
    want: ERROR
  - name: no systemd
    params: {unit: ssh.service}
    facts:
      services: {systemd: false, units: {}}
    want: NOT_APPLICABLE
