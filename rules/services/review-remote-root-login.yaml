id: services.review-remote-root-login
version: 1
title: Review root login through telnet and other remote terminal services
title_ko: telnet 등 원격 터미널 서비스의 root 로그인 검토
severity: high
description: >-
  Applies when telnet or rlogin is started; then shows how, for a review of whether root can log
  in through it. Not applicable otherwise. The OpenSSH checks do not cover these services.
description_ko: >-
  telnet이나 rlogin이 시작되어 있을 때 적용됩니다. 그 서비스로 root가 로그인할 수 있는지 검토할 수 있도록 서비스가 시작된 경로를 보여 줍니다. 그 밖에는
  해당하지 않습니다. OpenSSH 점검은 이 서비스들을 다루지 않습니다.
rationale: >-
  A telnet or rlogin server lets root log in remotely unless its login stack refuses it, and it
  sends the password in clear text.
rationale_ko: >-
  telnet이나 rlogin 서버는 로그인 스택이 거부하지 않으면 root가 원격으로 로그인하게 두고, 비밀번호도 평문으로 보냅니다.
remediation: >-
  Turn the service off (services.no-telnet, services.no-r-services) and use SSH. If it must run,
  keep root out of it: on systems that still ship pam_securetty (older distributions), put
  `auth required pam_securetty.so` in its PAM login stack and remove every pts/N line from
  /etc/securetty; elsewhere, the service must refuse root by other means.
remediation_ko: >-
  서비스를 끄고(services.no-telnet, services.no-r-services) SSH를 쓰세요. 꼭 실행해야 한다면 root를 막으세요.
  pam_securetty가 아직 있는 시스템(오래된 배포판)에서는 그 서비스의 PAM 로그인 스택에 `auth required pam_securetty.so`를 넣고
  /etc/securetty에서 pts/N 줄을 모두 지우세요. 그렇지 않은 곳에서는 다른 방법으로 서비스가 root를 거부하게 해야 합니다.
applies: >-
  services.started.exists(s, s.service in ["telnet", "telnetd", "rlogin", "rlogind", "krlogind", "ktelnet", "ktelnetd"] || (s.service == "login" && s.kind in ["inetd", "xinetd"]) || s.program.matches("/((in\\.)?(telnetd|rlogind)|k(telnetd|rlogind))$"))
manual:
  guidance: >-
    Check that root cannot log in through the service (pam_securetty in its auth stack and no pts/N line in /etc/securetty, where that module exists). Better, turn the service off.
  guidance_ko: >-
    그 서비스로 root가 로그인할 수 없는지 확인하세요(그 모듈이 있는 곳에서는 auth 스택의 pam_securetty와 /etc/securetty에 pts/N 줄이
    없는 것). 더 좋은 방법은 서비스를 끄는 것입니다.
  show: >-
    services.started.filter(s, s.service in ["telnet", "telnetd", "rlogin", "rlogind", "krlogind", "ktelnet", "ktelnetd"] || (s.service == "login" && s.kind in ["inetd", "xinetd"]) || s.program.matches("/((in\\.)?(telnetd|rlogind)|k(telnetd|rlogind))$")).map(s, s.name + " (" + s.kind + ") at " + s.source)
tests:
  - name: not started
    facts:
      services: {started: [{service: ssh, name: ssh.service, kind: unit, program: /usr/sbin/sshd, source: "/etc/systemd/system/multi-user.target.wants/ssh.service"}]}
    want: NOT_APPLICABLE
  - name: telnet started by inetd
    facts:
      services: {started: [{service: telnet, name: telnet, kind: inetd, program: /usr/sbin/in.telnetd, source: "/etc/inetd.conf:12"}]}
    want: MANUAL
  - name: running units unknown
    input: incomplete
    incomplete: [services]
    facts:
      services: {started: []}
    want: ERROR
  - name: rlogin by an inetd entry called login
    facts:
      services: {started: [{service: login, name: login, kind: inetd, program: /usr/sbin/tcpd, source: "/etc/inetd.conf:13"}]}
    want: MANUAL
  - name: a unit called login is not rlogin
    facts:
      services: {started: [{service: login, name: login.service, kind: unit, program: /usr/local/bin/banner, source: "/etc/systemd/system/multi-user.target.wants/login.service"}]}
    want: NOT_APPLICABLE
  - name: kerberized servers by program
    facts:
      services: {started: [{service: srv, name: srv, kind: xinetd, program: /usr/sbin/ktelnetd, source: "/etc/xinetd.d/srv:1"}, {service: ssh, name: ssh.service, kind: unit, source: x}]}
    want: MANUAL
  - name: krlogind by name
    facts:
      services: {started: [{service: krlogind, name: krlogind.service, kind: unit, source: x}]}
    want: MANUAL
  - name: telnet socket
    facts:
      services: {started: [{service: telnet, name: telnet.socket, kind: unit, source: "/etc/systemd/system/sockets.target.wants/telnet.socket"}]}
    want: MANUAL
