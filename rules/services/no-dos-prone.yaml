id: services.no-dos-prone
version: 1
title: Services that amplify traffic are not started
title_ko: DoS 공격에 취약한 서비스 미사용
severity: high
description: >-
  Lists the ways the echo, discard, daytime and chargen services are started: enabled units, units running now, init scripts and
  inetd/xinetd entries, found by service name.
description_ko: >-
  echo, discard, daytime, chargen 서비스가 시작되는 경로를 활성화된 유닛, 지금 실행 중인 유닛, init 스크립트, inetd/xinetd 항목
  중에서 서비스 이름으로 찾아 나열합니다.
rationale: >-
  These test services answer anyone, so attackers can bounce and amplify traffic through them.
rationale_ko: >-
  이 테스트용 서비스들은 누구에게나 응답하므로, 공격자가 이를 거쳐 트래픽을 되돌리거나 증폭할 수 있습니다.
remediation: >-
  Disable them in inetd/xinetd (`disable = yes`).
remediation_ko: >-
  inetd/xinetd에서 끄세요(`disable = yes`).
violations:
  over: services.started
  as: s
  where: >-
    s.service in ["echo", "discard", "daytime", "chargen"]
  key: s.kind + ":" + s.name
  text: >-
    s.name + " (" + s.kind + (s.program != "" ? ", " + s.program : "") + ") at " + s.source
  allow_empty: true
tests:
  - name: not started
    facts:
      services: {started: [{service: ssh, name: ssh.service, kind: unit, program: /usr/sbin/sshd, source: "/etc/systemd/system/multi-user.target.wants/ssh.service"}]}
    want: PASS
  - name: started
    facts:
      services: {started: [{service: echo, name: echo, kind: xinetd, source: "/etc/xinetd.d/echo-stream:1"}]}
    want: FAIL
  - name: running units unknown
    input: incomplete
    incomplete: [services]
    facts:
      services: {started: []}
    want: ERROR
