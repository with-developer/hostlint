id: files.setid-outside-system-dirs
version: 2
title: No set-ID programs outside the system program directories
title_ko: 시스템 디렉터리 밖의 SUID·SGID 파일 없음
severity: high
description: >-
  Lists files with the set-user-ID or set-group-ID bit outside /usr/bin, /usr/sbin, /usr/lib,
  /usr/lib64, /usr/libexec, /bin, /sbin, /lib and /lib64, such as in home directories, /tmp,
  /var, /opt or /srv.
description_ko: >-
  시스템 디렉터리(/usr/bin, /usr/sbin, /usr/lib, /usr/lib64, /usr/libexec, /bin, /sbin, /lib, /lib64) 밖에
  있는 set-user-ID, set-group-ID 파일을 나열합니다. 홈 디렉터리, /tmp, /var, /opt, /srv 등이 해당합니다.
rationale: >-
  Distributions install their set-ID programs in the system directories; one anywhere else is
  usually a leftover or a backdoor that grants its owner's rights to whoever runs it.
rationale_ko: >-
  배포판은 set-ID 프로그램을 시스템 디렉터리에 설치하므로, 다른 곳에 있는 것은 대개 남겨진 파일이거나 실행하는 사람에게 소유자의 권한을 주는 백도어입니다.
remediation: Remove the set-ID bits (`chmod u-s,g-s`) or the file, unless the software needs them.
remediation_ko: >-
  소프트웨어가 필요로 하지 않는다면 set-ID 비트를 떼거나(`chmod u-s,g-s`) 파일을 지우세요.
violations:
  over: filesystem.setid
  as: f
  where: >-
    !f.path.matches("^/(usr/)?(bin|sbin|lib|lib32|lib64|libx32|libexec)/")
  key: f.path
  text: >-
    f.path + " (" + f.mode + ", " + (f.owner != "" ? f.owner : string(f.uid)) + ")"
  allow_empty: true
tests:
  - name: system programs
    facts:
      filesystem: {setid: [{path: /usr/bin/passwd, mode: "4755", owner: root}, {path: /usr/lib/openssh/ssh-keysign, mode: "4755", owner: root}]}
    want: PASS
  - name: in a home directory
    facts:
      filesystem: {setid: [{path: /home/alice/.cache/sh, mode: "4755", owner: root}]}
    want: FAIL
  - name: in /usr/local
    facts:
      filesystem: {setid: [{path: /usr/local/bin/tool, mode: "4711", uid: 0, owner: root}]}
    want: FAIL
  - name: walk incomplete
    input: incomplete
    incomplete: [filesystem]
    facts:
      filesystem: {setid: []}
    want: ERROR
