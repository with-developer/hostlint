id: files.cron-spool-rhel
version: 1
title: Users' crontabs on the RHEL family are private
title_ko: RHEL 계열의 사용자 crontab은 본인만 읽고 쓸 수 있음
severity: high
description: >-
  Checks that the crontab files in /var/spool/cron (RHEL family) can be read and written by
  their owner only (mode 0600 or stricter). Debian and Ubuntu keep them in
  /var/spool/cron/crontabs, which is files.cron-spool. Root's crontab must also belong to root
  (files.cron-root-spool).
description_ko: >-
  /var/spool/cron(RHEL 계열)의 crontab 파일을 소유자만 읽고 쓸 수 있는지(모드 0600 또는 더 엄격) 확인합니다. Debian과 Ubuntu는
  /var/spool/cron/crontabs에 두며, 그쪽은 files.cron-spool이 봅니다. root의 crontab은 root가 소유해야 하며
  files.cron-root-spool이 따로 확인합니다.
rationale: A crontab other users can change runs commands as its owner, root's as root.
rationale_ko: >-
  다른 사용자가 바꿀 수 있는 crontab은 그 소유자의 권한으로, root의 것이라면 root 권한으로 명령을 실행하게 됩니다.
remediation: Run `chmod 600` on each listed crontab.
remediation_ko: >-
  나열된 crontab마다 `chmod 600`을 실행하세요.
platforms: [rhel]
file:
  paths: [/var/spool/cron/*]
  mode: "0600"
  missing: pass
  no_match: pass
tests:
  - name: private
    os: rhel
    files:
      /var/spool/cron/alice: {mode: "0600", owner: user}
    want: PASS
  - name: no crontabs
    os: rhel
    files: {}
    want: PASS
  - name: readable by others
    os: rhel
    files:
      /var/spool/cron/alice: {mode: "0644", owner: user}
    want: FAIL
  - name: Debian keeps them elsewhere
    os: debian
    files:
      /var/spool/cron/crontabs: {type: dir, mode: "1730"}
    want: NOT_APPLICABLE
  - name: spool unreadable
    os: rhel
    input: unavailable
    files:
      /var/spool/cron: {type: dir, mode: "0700", error: permission}
    want: ERROR
