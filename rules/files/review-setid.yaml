id: files.review-setid
version: 1
title: Review the set-ID programs
title_ko: SUID·SGID 파일 검토
severity: medium
description: Lists every file with the set-user-ID or set-group-ID bit on local filesystems.
description_ko: >-
  로컬 파일 시스템에서 set-user-ID나 set-group-ID 비트가 설정된 파일을 모두 나열합니다.
rationale: Each set-ID program runs with its owner's or group's rights; the ones nobody needs only add risk.
rationale_ko: >-
  set-ID 프로그램은 그 소유자나 그룹의 권한으로 실행되므로, 아무도 필요로 하지 않는 것은 위험만 더합니다.
remediation: Remove the set-ID bits (`chmod u-s,g-s`) from programs your users do not need, or limit who can run them.
remediation_ko: >-
  사용자가 필요로 하지 않는 프로그램에서는 set-ID 비트를 떼거나(`chmod u-s,g-s`), 실행할 수 있는 사람을 제한하세요.
manual:
  guidance: Check that every listed program needs its set-ID bit.
  guidance_ko: >-
    나열된 프로그램마다 set-ID 비트가 정말 필요한지 확인하세요.
  show: >-
    filesystem.setid.map(f, f.path + " " + f.mode + " " + (f.owner != "" ? f.owner : string(f.uid)))
