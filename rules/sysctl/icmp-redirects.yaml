id: sysctl.icmp-redirects
version: 1
title: ICMP redirects are neither accepted nor sent
title_ko: ICMP 리다이렉트를 받지도 보내지도 않음
severity: medium
description: >-
  Checks net.ipv4.conf.all.accept_redirects, net.ipv4.conf.default.accept_redirects and net.ipv4.conf.all.send_redirects, which must all be 0. On a running host the values are what the kernel reports; for a mounted root they are what the files of sysctl.d(5) set at boot, and one they do not set cannot be judged.
rationale: >-
  A forged redirect changes the routes of a host, and a host that sends redirects tells others about its network.
remediation: >-
  Set the three parameters to 0 in a file of /etc/sysctl.d and apply them with `sysctl --system`.
applies: >-
  !target.image
failure: >-
  The kernel accepts or sends ICMP redirects.
expect: >-
  sysctl.params["net.ipv4.conf.all.accept_redirects"].value == "0" &&
  sysctl.params["net.ipv4.conf.default.accept_redirects"].value == "0" &&
  sysctl.params["net.ipv4.conf.all.send_redirects"].value == "0"
tests:
  - name: as required
    facts:
      sysctl: {live: true, params: {"net.ipv4.conf.all.accept_redirects": {value: "0", source: "/proc/sys/net/ipv4/conf/all/accept_redirects"}, "net.ipv4.conf.default.accept_redirects": {value: "0", source: "/proc/sys/net/ipv4/conf/default/accept_redirects"}, "net.ipv4.conf.all.send_redirects": {value: "0", source: "/proc/sys/net/ipv4/conf/all/send_redirects"}}}
    want: PASS
  - name: the first is set the other way
    facts:
      sysctl: {live: true, params: {"net.ipv4.conf.all.accept_redirects": {value: "1", source: "/proc/sys/net/ipv4/conf/all/accept_redirects"}, "net.ipv4.conf.default.accept_redirects": {value: "0", source: "/proc/sys/net/ipv4/conf/default/accept_redirects"}, "net.ipv4.conf.all.send_redirects": {value: "0", source: "/proc/sys/net/ipv4/conf/all/send_redirects"}}}
    want: FAIL
  - name: the last is set the other way
    facts:
      sysctl: {live: true, params: {"net.ipv4.conf.all.accept_redirects": {value: "0", source: "/proc/sys/net/ipv4/conf/all/accept_redirects"}, "net.ipv4.conf.default.accept_redirects": {value: "0", source: "/proc/sys/net/ipv4/conf/default/accept_redirects"}, "net.ipv4.conf.all.send_redirects": {value: "1", source: "/proc/sys/net/ipv4/conf/all/send_redirects"}}}
    want: FAIL
  - name: a container image has no kernel of its own
    facts:
      target: {live: false, image: true}
      sysctl: {live: false, params: {}}
    want: NOT_APPLICABLE
  - name: one of them is not set in the files of a mounted root
    input: absent
    facts:
      sysctl: {live: false, params: {"net.ipv4.conf.all.accept_redirects": {value: "0", source: "x"}, "net.ipv4.conf.default.accept_redirects": {value: "0", source: "x"}}}
    want: ERROR
