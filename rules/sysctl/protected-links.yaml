id: sysctl.protected-links
version: 1
title: Links in world-writable directories are protected
title_ko: 누구나 쓸 수 있는 디렉터리의 링크를 보호함
severity: low
description: >-
  Checks fs.protected_hardlinks and fs.protected_symlinks, which must both be 1. On a running host the values are what the kernel reports; for a mounted root they are what the files of sysctl.d(5) set at boot, and one they do not set cannot be judged.
description_ko: >-
  fs.protected_hardlinks와 fs.protected_symlinks를 확인하며, 둘 다 1이어야 합니다. 실행 중인 호스트에서는 커널이 알려 주는 값을 쓰고,
  마운트한 루트에서는 부팅할 때 sysctl.d(5)의 파일이 정하는 값을 씁니다. 그 파일이 정하지 않은 값은 판단할 수 없습니다.
rationale: >-
  Without them a user can plant a link that makes a privileged program open a file the user chose.
rationale_ko: >-
  이 보호가 없으면 사용자가 링크를 심어 두어, 권한 있는 프로그램이 사용자가 고른 파일을 열게 만들 수 있습니다.
remediation: >-
  Set `fs.protected_hardlinks = 1` and `fs.protected_symlinks = 1` in a file of /etc/sysctl.d and apply them with `sysctl --system`.
remediation_ko: >-
  /etc/sysctl.d의 파일에 `fs.protected_hardlinks = 1`과 `fs.protected_symlinks = 1`을 설정하고 `sysctl
  --system`으로 적용하세요.
applies: >-
  !target.image
failure: >-
  Links in a sticky world-writable directory are not protected.
expect: >-
  sysctl.params["fs.protected_hardlinks"].value == "1" &&
  sysctl.params["fs.protected_symlinks"].value == "1"
tests:
  - name: as required
    facts:
      sysctl: {live: true, params: {"fs.protected_hardlinks": {value: "1", source: "/proc/sys/fs/protected_hardlinks"}, "fs.protected_symlinks": {value: "1", source: "/proc/sys/fs/protected_symlinks"}}}
    want: PASS
  - name: the first is set the other way
    facts:
      sysctl: {live: true, params: {"fs.protected_hardlinks": {value: "0", source: "/proc/sys/fs/protected_hardlinks"}, "fs.protected_symlinks": {value: "1", source: "/proc/sys/fs/protected_symlinks"}}}
    want: FAIL
  - name: the last is set the other way
    facts:
      sysctl: {live: true, params: {"fs.protected_hardlinks": {value: "1", source: "/proc/sys/fs/protected_hardlinks"}, "fs.protected_symlinks": {value: "0", source: "/proc/sys/fs/protected_symlinks"}}}
    want: FAIL
  - name: a container image has no kernel of its own
    facts:
      target: {live: false, image: true}
      sysctl: {live: false, params: {}}
    want: NOT_APPLICABLE
  - name: one of them is not set in the files of a mounted root
    input: absent
    facts:
      sysctl: {live: false, params: {"fs.protected_hardlinks": {value: "1", source: "x"}}}
    want: ERROR
